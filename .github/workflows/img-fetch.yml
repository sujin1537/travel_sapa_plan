name: img-fetch
on:
  push:
    branches: [img-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: |
          mkdir -p jp
          UA="TripbookBot/1.0 (github.com/sujin1537)"
          while read name url; do
            [ -z "$name" ] && continue
            curl -sSL -A "$UA" -o "jp/$name.jpg" "$url" || echo "fail $name"
            sleep 1
          done < img-list.txt
          ls -la jp
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add jp
          git commit -m "fetched images" || echo nothing
          git push
