name: Validate inline JavaScript
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract inline scripts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No inline script found');
          fs.writeFileSync('/tmp/travel-planner-inline.js', scripts.map(m => m[1]).join('\n'));
          console.log(`Extracted ${scripts.length} script block(s)`);
          NODE
      - name: Check JavaScript syntax
        run: node --check /tmp/travel-planner-inline.js
