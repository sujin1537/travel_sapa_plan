/* ===== Decision board ===== */
.db-wrap{margin-top:14px}
.var-badge{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:#fff2a6;color:#5a4a00;font-style:normal;font-size:10.5px;font-weight:800;vertical-align:middle}
.var-sw{margin:10px 0 12px;padding:12px;border-radius:16px;background:#fffbe6;border:1px solid #f3e7a6}.var-t{display:block;font-size:12.5px;font-weight:800;margin-bottom:8px}.var-t small{font-weight:600;color:var(--muted)}.var-opts{display:flex;flex-wrap:wrap;gap:6px}.var-opt{font:inherit;font-size:13px;font-weight:800;padding:8px 12px;border-radius:999px;border:1.5px solid #e6dca0;background:#fff;color:var(--ink);cursor:pointer}.var-opt.on{background:var(--ink);border-color:var(--ink);color:#fff}.var-d{margin:8px 2px 0;font-size:12.5px;color:#5c5a4c}
.snk{margin:14px 0 6px;background:#fff;border:1px solid #ececf0;border-radius:16px;padding:12px 14px}.snk summary{cursor:pointer;display:flex;flex-direction:column;gap:2px;list-style:none}.snk summary small{color:var(--muted);font-size:12px}.snk ul{list-style:none;margin:10px 0 4px;padding:0}.snk li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 0;border-top:1px solid #f1f1f3;font-size:13.5px}.snk li i{color:var(--muted);font-size:12px;font-style:normal}.snk li span{grid-column:1/2;font-size:12.5px;color:#555}.snk li em{grid-column:2;grid-row:1/3;align-self:center;font-style:normal;font-weight:800;font-size:12.5px}.snk-by{font-size:11.5px;color:var(--muted);margin:4px 0 0}
.kw-days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:2px 0 10px}
.kw-day{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;padding:8px 12px;border-radius:14px;border:1.5px solid #e6e6ea;background:#fff;font:inherit;cursor:pointer;color:var(--ink)}
.kw-day b{font-size:14px}.kw-day small{font-size:11px;color:var(--muted)}
.kw-day.on{background:var(--ink);border-color:var(--ink);color:#fff}.kw-day.on small{color:#c9c9d1}
.kw-top{background:var(--ink);color:#fff;border-radius:18px;padding:14px 16px;margin-bottom:10px}
.kw-top>div{font-size:14px;font-weight:700}.kw-top>div b{font-size:24px;letter-spacing:-.02em;margin-right:4px}
.kw-top p{margin:4px 0 10px;font-size:12.5px;color:#c9c9d1}.kw-top em{font-style:normal;color:var(--sun,#ffd84d);font-weight:800}
.kw-act{display:flex;flex-wrap:wrap;gap:6px}.kw-act button{font:inherit;font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;border:0;background:#2c2c33;color:#fff;cursor:pointer}.kw-act button:disabled{opacity:.35;cursor:default}
.kw-svgw{overflow-x:auto;background:#fff;border:1px solid #ececf0;border-radius:16px;-webkit-overflow-scrolling:touch}
.kw-svgw svg{display:block}
.kw-ln{fill:none;stroke:#dcdce2;stroke-width:1.3}.kw-ln.on{stroke-width:3}.kw-ln.fr{stroke-width:1.6;opacity:.55}
.kw-nd rect{fill:#f3f3f5;stroke:#e2e2e7;stroke-width:1.3}.kw-nd text{font-size:11.5px;font-weight:700;fill:#9a9aa3;font-family:inherit}
.kw-nd.fr text{font-weight:800}.kw-nd .kw-n{font-size:10px;font-weight:800;fill:#9a9aa3!important}
.kw-nd[data-kw-id]{cursor:pointer}.kw-nd[data-kw-id]:hover rect{stroke:#16161a}
.kw-hint{margin:6px 4px 12px;font-size:11.5px;color:var(--muted)}
.kw-path{list-style:none;margin:0 0 14px;padding:12px 14px;background:#fff;border:1px solid #ececf0;border-radius:16px}
.kw-path li{display:flex;gap:10px;align-items:flex-start;padding:6px 0 6px 10px;border-left:3px solid var(--c,#16161a)}
.kw-path time{font-weight:800;font-size:13px;min-width:42px;font-variant-numeric:tabular-nums}
.kw-path span{flex:1;display:flex;flex-direction:column;font-size:13.5px}.kw-path small{color:var(--muted);font-size:11.5px}
.kw-path .db-i{font-style:normal;margin:0}
.kw-h{font-size:16px;margin:4px 2px 8px}.kw-h small{font-size:12px;color:var(--muted);font-weight:600;margin-left:4px}
.kw-sec{margin-bottom:10px}.kw-sech{font-size:12.5px;font-weight:800;color:var(--muted);margin:0 2px 6px}
.kw-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kw-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;font:inherit;padding:10px 12px;border-radius:14px;border:1.5px solid #ececf0;border-left:4px solid var(--c);background:#fff;cursor:pointer;color:var(--ink)}
.kw-opt b{font-size:14px}.kw-opt small{font-size:11.5px;color:var(--muted);line-height:1.4}.kw-opt .kw-x{color:#c0392b;font-weight:700}
.kw-opt:active{transform:scale(.98)}.kw-opt.soon{background:#f7f7f9;border-style:dashed}.kw-opt.soon .kw-x{color:#7a5a00}
.kw-doneb{background:#fff;border:1.5px dashed #c9c9d1;border-radius:16px;padding:14px;font-weight:800;font-size:14px;line-height:1.6}.kw-doneb small{font-weight:600;color:var(--muted)}

.db-i{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:800;color:#3b6fd8;text-decoration:underline;text-underline-offset:2px;padding:2px 0}
.dbx-pop{padding:20px 18px}.dbx-pop h3{margin:0 0 6px;font-size:19px}.dbx-pop p{margin:0 0 8px;line-height:1.6;font-size:14.5px}.dbx-pop .dbx-meta{color:#777;font-size:12.5px}
.db-top{background:var(--ink);color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:10px}

.db-top div{font-size:15px;font-weight:700}

.db-cards{display:grid;gap:10px}

.db-card{background:#fff;border-radius:18px;padding:16px;border:1px solid #ececf0}

.db-hint{margin:6px 0 0;font-size:12.5px;color:#6b6b75;line-height:1.5}
.db-opts{display:grid;gap:6px;margin-top:12px}
.db-opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:12px;border:1.5px solid #ececf0;background:#fafafb;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,background .15s}

/* ===== Train compare ===== */
.tc{background:#fff;border-radius:18px;border:1px solid #ececf0;padding:18px 16px;margin:12px 0}

iv id="food-places-list" class="food-places-list">${foodPlaces.hanoi.map((p,i)=>foodPlaceCard(p,i,"hanoi")).join("")}</div></div><p class="meta-line foot">영업시간·가격은 방문 전 구글 지도에서 한 번 더 확인</p></section>

 <section id="view-learn" class="view"><div class="view-cover"><img src="https://images.unsplash.com/photo-1528127269322-539801943592?w=1400&q=75&auto=format&fit=crop" alt="하노이 구시가지" loading="lazy"><div class="view-cover-shade"></div><div class="view-cover-copy"><h2>알고 가기</h2><p>아는 만큼 보여 · 하노이·사파 기본 공부</p></div></div><div class="lr-wrap"><div class="seg-tabs lr-tabs" role="tablist" data-seg="learn"><button type="button" class="seg-tab active" data-seg-btn="entry">🛂 입국 준비</button><button type="button" class="seg-tab" data-seg-btn="hn">🇻🇳 하노이</button><button type="button" class="seg-tab" data-seg-btn="sp">⛰ 사파</button><button type="button" class="seg-tab" data-seg-btn="vi">🗣 여행 베트남어</button></div><div class="seg-panel active" data-seg-of="learn" data-seg-id="entry"><article class="lr-card"><h3>🛂 온라인 입국신고 (PAI) · 미리 해 두면 편해</h3><p>종이 입국신고서는 없어졌고, 2026년부터 노이바이도 <b>온라인 입국신고</b>를 받아. "필수"라는 곳과 "권장"이라는 곳이 섞여 있는데, <b>안 했어도 도착 홀에 붙은 QR로 현장에서 작성 가능</b>해. 다만 새벽 1시 도착이라 와이파이 잡고 줄 서서 쓰는 것보단 미리 해 두는 게 빨라. 건강신고서는 지금 필요 없어.</p><dl class="lr-facts"><dt>공식 사이트</dt><dd><a href="https://prearrival.immigration.gov.vn" target="_blank" rel="noopener">prearrival.immigration.gov.vn</a> · 무료 · 오른쪽 위에서 한국어 선택 · 돈 받는 대행 사이트는 가짜</dd><dt>언제</dt><dd>도착 72시간 전부터 가능 → <b>11/11(수) ~ 11/13(금) 출발 전</b> · 못 했으면 공항 도착 홀 QR로</dd><dt>누가</dt><dd>한 번에 최대 10명 같이 입력 가능 · QR은 1인당 하나</dd><dt>마무리</dt><dd>이메일 OTP 3분 안에 입력 → PAI 번호·QR 캡처해서 셋 다 폰에 저장</dd></dl></article><article class="lr-card"><h3>📝 입력값 미리 정리</h3><dl class="lr-facts"><dt>여권 종류</dt><dd>P – Popular Passport (일반 여권)</dd><dt>여권번호·만료일·발급지</dt><dd>각자 여권 보고 · 만료일이 입국일(11/14)부터 6개월 이상 남아야 해</dd><dt>이름·성별·생년월일·국적</dt><dd>여권 그대로 · Republic of Korea</dd><dt>전화번호·이메일</dt><dd>각자 본인 것 · 이메일로 OTP·QR이 와</dd><dt>비자 종류</dt><dd>국가별 기본 비자 면제 (한국인 무비자 45일)</dd><dt>출발지</dt><dd>인천, 대한민국</dd><dt>여행 목적</dt><dd>관광 (Tourism)</dd><dt>교통수단·편명</dt><dd>항공 · 7C2201 (제주항공)</dd><dt>입국 공항</dt><dd>노이바이 국제공항 (HAN)</dd><dt>도착일</dt><dd>2026-11-14</dd><dt>숙소 종류</dt><dd>호텔</dd><dt>숙소 지역</dt><dd>하노이 (Hà Nội) · 호안끼엠 (Hoàn Kiếm)</dd><dt>숙소 이름</dt><dd>Delica Premium Hotel (목록에 없으면 직접 입력)</dd><dt>숙소 주소</dt><dd>41 Hàng Quạt, Hoàn Kiếm, Hà Nội</dd><dt>숙소 연락처</dt><dd>WON트래블 예약 확정서에 있는 호텔 번호 (필수로 나올 때만)</dd><dt>출국 예정일</dt><dd>2026-11-18 (VJ960 01:45)</dd></dl></article><article class="lr-card"><h3>🧳 세관 신고 (해당될 때만)</h3><p>전자담배 · 22도 넘는 술 1.5L 초과 · 담배 200개비 초과 · 현금 5,000달러 또는 1,500만동 초과 · 금 300g 초과 → 짐 찾는 곳(세관 구역)에 있는 신고서 작성. 그 외엔 그냥 통과.</p><p class="lr-src">참고: <a href="https://vietnamguide.co.kr/%EB%B2%A0%ED%8A%B8%EB%82%A8-%EC%9E%85%EA%B5%AD%EC%8B%A0%EA%B3%A0%EC%84%9C/" target="_blank" rel="noopener">베트남가이드</a> · <a href="https://yomolabs.kr/2026-vietnam-pai-and-health-declaration" target="_blank" rel="noopener">요모매거진</a> · 10/16 확인 · 출발 전 공식 사이트에서 한 번 더 확인</p></article></div><div class="seg-panel" data-seg-of="learn" data-seg-id="hn"><div class="seg-tabs lr-tabs" role="tablist" data-seg="lh"><button type="button" class="seg-tab active" data-seg-btn="ov">한눈에</button><button type="button" class="seg-tab" data-seg-btn="hist">역사</button><button type="button" class="seg-tab" data-seg-btn="area">동네·지도</button><button type="button" class="seg-tab" data-seg-btn="cult">문화·음식</button><button type="button" class="seg-tab" data-seg-btn="tip">꿀팁</button></div><div class="seg-panel active" data-seg-of="lh" data-seg-id="ov"><article class="lr-card"><h3>하노이 한눈에</h3><dl class="lr-facts"><dt>어떤 도시</dt><dd>베트남의 수도이자 북부의 중심 · 남쪽 호찌민(사이공)이 경제 도시라면 하노이는 정치·역사·문화 도시</dd><dt>이름 뜻</dt><dd>Hà Nội(河內) = “강 안쪽” · 홍강(Sông Hồng)이 도시를 감싸 흘러서 붙은 이름</dd><dt>인구</dt><dd>약 850만 명 (수도권 기준) · 오토바이가 수백만 대라 길이 늘 붐벼</dd><dt>나이</dt><dd>1010년 수도가 된 천 년 고도 · 2010년에 ‘탕롱–하노이 천 년’ 축제</dd><dt>11월 날씨</dt><dd>건기라 맑고 선선 · 낮 23–26°C, 밤 17–20°C 정도 · 얇은 긴팔이면 OK</dd><dt>돈</dt><dd>베트남 동(VND) · 1만동 ≈ 520원 · 0이 많으니 뒤에서 세 자리 떼고 보기 (100,000동 ≈ 5,200원)</dd><dt>시차</dt><dd>한국보다 2시간 느림 (한국 12시 = 하노이 10시)</dd></dl></article><article class="lr-card"><h3>하노이를 한 줄로</h3><ul class="lr-ul"><li><b>호수의 도시</b> · 시내에 호수가 수십 개 · 중심은 호안끼엠 호수, 가장 큰 건 서호(떠이호)</li><li><b>세 겹의 시간</b> · 천 년 된 베트남 옛 거리(구시가지) + 프랑스 식민 시대 건물(프렌치 쿼터) + 사회주의 국가의 수도(바딘 광장)</li><li><b>길거리 문화</b> · 인도 위 낮은 플라스틱 의자에 앉아 쌀국수·커피·맥주를 즐기는 게 하노이 일상</li><li><b>커피 도시</b> · 에그커피의 고향 · 카페가 골목마다 있어</li></ul></article></div><div class="seg-panel" data-seg-of="lh" data-seg-id="hist"><article class="lr-card"><h3>하노이 역사 타임라인</h3><ol class="lr-tl"><li><time>1010년</time><div>리(Lý) 왕조 리 타이 또가 수도를 옮기며 <b>탕롱(昇龍, 용이 오르다)</b>이라 이름 붙임</div></li><li><time>1070년</time><div>공자를 모시는 <b>문묘(Văn Miếu)</b> 건립 · 1076년 베트남 첫 대학 국자감</div></li><li><time>15세기</time><div>레 러이 왕이 명나라를 몰아냄 → <b>호안끼엠(還劍, 검을 돌려준) 호수 전설</b>의 배경</div></li><li><time>1802년</time><div>응우옌 왕조가 수도를 중부 <b>후에</b>로 옮김 · 1831년 ‘하노이’라는 이름이 생김</div></li><li><time>1880년대–1945</time><div>프랑스 식민 시대 · 1902년 프랑스령 인도차이나의 수도 · 오페라하우스·성당·롱비엔 다리가 이때 지어짐</div></li><li><time>1954년</time><div>디엔비엔푸 전투 후 프랑스 철수 → 북베트남의 수도</div></li><li><time>1960–70년대</time><div>베트남 전쟁 · 폭격을 견딘 롱비엔 다리가 상징</div></li><li><time>1976년</time><div>통일 베트남의 수도</div></li><li><time>1986년~</time><div><b>도이머이(쇄신)</b> 개방 정책 → 지금의 활기찬 하노이</div></li></ol></article><article class="lr-card"><h3>호안끼엠 호수 전설</h3><p class="lr-p">15세기 레 러이가 호수의 거북이 신에게서 신비한 검을 받아 명나라 군대를 물리쳤어. 전쟁이 끝난 뒤 배를 타고 호수에 나가자 거북이가 나타나 검을 돌려달라고 했고, 검을 돌려줬대. 그래서 이름이 <b>호안끼엠(검을 돌려준 호수)</b>이고, 호수 가운데 작은 <b>거북탑</b>이 그 상징이야.</p></article></div><div class="seg-panel" data-seg-of="lh" data-seg-id="area"><article class="lr-card"><h3>구시가지·신시가지가 어디야? <small>지도</small></h3><div class="lr-map" id="lr-map-hn" data-city="hn"></div><ul class="lr-areas"><li><i style="background:#e0335a"></i><b>구시가지 (Phố Cổ)</b><span>호안끼엠 호수 북쪽 · “36거리” · 골목마다 같은 물건 파는 거리 · 우리 숙소·버스 하차·맛집 대부분 여기</span><em class="lr-ex">🏛 <button type="button" class="pk" data-peek="동쑤언 시장">동쑤언 시장</button> · <button type="button" class="pk" data-peek="항마">항마 거리 등불 골목</button> · <button type="button" class="pk" data-peek="맥주거리">맥주거리 따히엔</button><br>🍜 <button type="button" class="pk" data-peek="분보남보">분보남보 박프엉</button> · <button type="button" class="pk" data-peek="Bún chả">분짜 항꿧</button> · ☕ <button type="button" class="pk" data-peek="Cafe Giảng">Cafe Giảng</button></em></li><li><i style="background:#3c8dde"></i><b>호안끼엠 호수</b><span>도시의 중심 · 금~일 저녁엔 호수 주변이 차 없는 보행자 거리</span><em class="lr-ex">🏛 <button type="button" class="pk" data-peek="응옥선">응옥선 사당·테훅 다리</button> · <button type="button" class="pk" data-peek="성 요셉">성 요셉 성당</button> · 탕롱 수상인형극장<br>☕ <button type="button" class="pk" data-peek="Cafe Đinh">Cafe Đinh</button> · <button type="button" class="pk" data-peek="콩카페">콩카페 호수뷰</button> · <button type="button" class="pk" data-peek="Phở 10">포10</button></em></li><li><i style="background:#7b5cd6"></i><b>프렌치 쿼터</b><span>호수 남·동쪽 · 넓은 가로수길과 노란 프랑스식 건물 · 오페라하우스·고급 호텔</span><em class="lr-ex">🏛 오페라하우스 · 호아로 수용소(“하노이 힐튼”) · 메트로폴 호텔(에그커피 탄생지)<br>🍦 <button type="button" class="pk" data-peek="짱띠엔">짱띠엔 아이스크림</button> · 🍜 <button type="button" class="pk" data-peek="오바마">오바마 분짜 (흐엉리엔)</button></em></li><li><i style="background:#2e9e6b"></i><b>바딘 (정치 중심)</b><span>호찌민 묘·주석궁·한기둥 사원 · 정부 기관이 모인 곳</span><em class="lr-ex">🏛 <button type="button" class="pk" data-peek="한기둥">호찌민 묘·한기둥 사원</button> · <button type="button" class="pk" data-peek="탕롱">탕롱 황성 (유네스코)</button> · 문묘(베트남 첫 대학)<br>💡 호찌민 묘는 오전에만 · 복장 단정하게</em></li><li><i style="background:#b5651d"></i><b>하노이역 · 기찻길</b><span>구시가지 서남쪽 · 11/14 밤 사파행 기차 타는 곳 · 근처에 기찻길 카페 골목</span><em class="lr-ex">🚂 <button type="button" class="pk" data-peek="기찻길">기찻길 카페 골목</button> · 11/14 밤 차파 익스프레스 출발역<br>🍜 <button type="button" class="pk" data-peek="포가">포가응우옛</button>(닭 쌀국수) · 하노이역 근처 숙소 어쿠스틱·미네르바</em></li><li><i style="background:#16a3a3"></i><b>떠이호 (서호)</b><span>하노이에서 제일 큰 호수 · 외국인·카페·바가 많은 여유로운 동네 · 롯데몰 떠이호</span><em class="lr-ex">🏛 쩐꾸옥 사원(하노이에서 가장 오래된 절) · 롯데몰 떠이호<br>🍜 <button type="button" class="pk" data-peek="짜오반">짜오반 (가정식)</button> · <button type="button" class="pk" data-peek="반똠">반똠 (새우튀김)</button></em></li><li><i style="background:#888"></i><b>신시가지 (까우저이·미딩)</b><span>서쪽으로 쭉 뻗은 새 동네 · 고층 빌딩·대형 쇼핑몰·주거단지 · 관광보다는 생활권</span><em class="lr-ex">🏛 베트남 민족학 박물관 · 롯데센터 전망대 · 미딩 국립경기장<br>💆 <button type="button" class="pk" data-peek="쓰리따봉">쓰리따봉 스파</button>(짐 보관 · 출국 전 코스)</em></li><li><i style="background:#555"></i><b>롱비엔 (강 건너)</b><span>홍강 동쪽 · 1903년 프랑스가 놓은 롱비엔 다리 건너편</span><em class="lr-ex">🌉 <button type="button" class="pk" data-peek="롱비엔">롱비엔 다리</button> 걸어서 건너기 · 해질녘 강 풍경<br>☕ 다리 옆 기차 뷰 카페들 (구시가지 쪽 끝)</em></li></ul></article><article class="lr-card"><h3>구시가지 = “36거리”</h3><p class="lr-p">옛날 왕궁 동쪽에 장인·상인들이 모여 살며 <b>거리마다 한 가지 물건만</b> 만들고 팔았어. 그래서 길 이름이 대부분 <b>“Hàng(항) + 물건”</b>이야. 지금도 그 흔적이 남아 있어서 걷다 보면 재밌어.</p><ul class="lr-ul"><li><b>Hàng Bạc</b> 은(銀) 거리 · 귀금속</li><li><b>Hàng Gai</b> 삼베 → 지금은 실크·기념품</li><li><b>Hàng Mã</b> 종이 제사용품 · 명절 장식·등불</li><li><b>Hàng Bè</b> 뗏목 · <b>Hàng Đào</b> 비단 염색</li><li><b>Hàng Điếu</b> 담뱃대 → 지금은 분보남보 맛집 거리</li></ul><p class="lr-note">집이 좁고 길어서 “튜브 하우스(nhà ống)”라고 불러 · 옛날 세금이 가게 앞면 폭 기준이라 앞은 좁고 뒤로 길게 지었대.</p></article><article class="lr-card"><h3>신시가지는?</h3><p class="lr-p">1990년대 개방 이후 도시가 서쪽으로 커지면서 생긴 <b>까우저이·미딩·남뜨리엠</b> 쪽 새 동네야. 고층 아파트, 대형 쇼핑몰, 경기장, 회사가 모여 있어. 사파 버스 중 G8·사오비엣 08:55는 이쪽에 내려줘서, 구시가지까지는 그랩 30분 정도 걸려.</p></article></div><div class="seg-panel" data-seg-of="lh" data-seg-id="cult"><article class="lr-card"><h3>알고 가면 재밌는 하노이 문화</h3><ul class="lr-ul"><li><b>쌀국수(퍼, Phở)</b> · 20세기 초 북베트남에서 시작 · 하노이식은 맑은 국물에 고명이 단출 · 아침 음식</li><li><b>분짜(Bún chả)</b> · 숯불 돼지고기 + 쌀국수면을 새콤달콤 국물에 찍어 먹는 하노이 대표 점심</li><li><b>에그커피(cà phê trứng)</b> · 1946년 우유가 귀할 때 메트로폴 호텔 바텐더 응우옌 반 지앙이 달걀노른자로 만든 게 시작 → 그 가족이 연 곳이 <b>Cafe Giảng</b>, 딸이 연 곳이 <b>Cafe Đinh</b></li><li><b>보도 위 플라스틱 의자</b> · 낮은 의자에 앉아 먹고 마시는 “길거리 카페” 문화</li><li><b>수상 인형극</b> · 홍강 삼각주 농촌에서 천 년 넘게 이어진 물 위 인형극 · 호수 앞 탕롱 극장</li><li><b>오토바이</b> · 가족 넷이 한 대에 타는 것도 흔함 · 그랩 바이크로 직접 타 볼 수도</li><li><b>주말 보행자 거리</b> · 금~일 저녁 호수 주변 차 통제 → 공연·놀이·야시장</li></ul></article></div><div class="seg-panel" data-seg-of="lh" data-seg-id="tip"><article class="lr-card"><h3>하노이 여행 꿀팁</h3><ul class="lr-ul"><li><b>길 건너기</b> · 뛰지 말고 <b>일정한 속도로 천천히</b> 걸으면 오토바이가 피해 감 · 갑자기 멈추거나 뒤로 가기 X</li><li><b>흥정</b> · 시장·노점은 흥정 문화 · 가게·식당은 정찰제</li><li><b>팁</b> · 원칙적으로 없음 · 마사지는 팁 포함 여부 꼭 확인</li><li><b>그랩(Grab)</b> · 택시보다 그랩 앱이 편하고 가격 투명 · 공항↔시내도 그랩</li><li><b>사원·묘</b> · 어깨·무릎 가리는 옷 · 호찌민 묘는 보통 월·금 휴무 + 가을 정비 기간 있음</li><li><b>현금</b> · 노점·작은 가게는 현금만 · 큰 지폐는 거스름돈 없을 수 있어</li><li><b>인사말</b> · 신짜오(Xin chào) 안녕 · 깜언(Cảm ơn) 고마워 · 바오 니에우(Bao nhiêu?) 얼마예요</li></ul></article></div></div><div class="seg-panel" data-seg-of="learn" data-seg-id="sp"><div class="seg-tabs lr-tabs" role="tablist" data-seg="ls"><button type="button" class="seg-tab active" data-seg-btn="ov">한눈에</button><button type="button" class="seg-tab" data-seg-btn="hist">역사</button><button type="button" class="seg-tab" data-seg-btn="eth">소수민족</button><button type="button" class="seg-tab" data-seg-btn="nat">자연·지도</button><button type="button" class="seg-tab" data-seg-btn="food">음식</button><button type="button" class="seg-tab" data-seg-btn="tip">꿀팁</button></div><div class="seg-panel active" data-seg-of="ls" data-seg-id="ov"><article class="lr-card"><h3>사파 한눈에</h3><dl class="lr-facts"><dt>어디</dt><dd>베트남 최북단 라오까이성 · 중국 국경에서 가까운 산악 마을</dd><dt>높이</dt><dd>해발 약 1,500–1,600m · 그래서 하노이보다 훨씬 서늘하고 안개가 잦아</dd><dt>가는 법</dt><dd>하노이 → 라오까이역 야간열차 약 8시간 → 차로 1시간 (우리: 차파 익스프레스 21:45)</dd><dt>11월 날씨</dt><dd>낮 13–18°C, 밤 6–10°C · 판시판 정상은 0°C 가까이 · 안개·이슬비 잦음 → 패딩·핫팩 필수</dd><dt>유명한 것</dt><dd>계단식 논 · 판시판(인도차이나 최고봉) · 소수민족 마을 · 운해(구름바다)</dd></dl></article><article class="lr-card"><h3>11월 사파는?</h3><p class="lr-p">계단식 논은 <b>9월 황금빛 추수</b>가 절정이고, 11월엔 추수가 끝나 논이 비어 있는 갈색·초록 풍경이야. 대신 공기가 맑은 날엔 산맥이 선명하고, 아침엔 골짜기에 <b>운해</b>가 깔리기도 해. 날씨가 하루에도 몇 번씩 바뀌니까 판시판은 “맑은 날 바로 가기”가 정답.</p></article></div><div class="seg-panel" data-seg-of="ls" data-seg-id="hist"><article class="lr-card"><h3>사파 역사</h3><ol class="lr-tl"><li><time>수백 년 전</time><div>몽족·다오족 등 소수민족이 남쪽 중국에서 이주해 산비탈에 계단식 논을 만들며 정착</div></li><li><time>1895년</time><div>프랑스 선교사들이 들어오며 시내 <b>돌성당</b>이 이 무렵 세워짐</div></li><li><time>1920년대</time><div>프랑스가 더위를 피하는 <b>고원 휴양지(hill station)</b>로 개발 → 별장·호텔이 생김</div></li><li><time>1950–70년대</time><div>프랑스 철수와 전쟁 · 1979년 중국–베트남 국경 전쟁으로 큰 피해</div></li><li><time>1990년대~</time><div>관광 개방 → 트레킹·홈스테이로 유명해짐</div></li><li><time>2016년</time><div>판시판 케이블카 개통 · 기네스 기록(세계 최장 3선 케이블카 약 6.3km) → 걸어서 이틀 걸리던 정상을 20분 만에</div></li></ol></article></div><div class="seg-panel" data-seg-of="ls" data-seg-id="eth"><article class="lr-card"><h3>사파의 소수민족</h3><ul class="lr-ul"><li><b>흑몽족 (H’Mông Đen)</b> · 사파에서 가장 많음 · 쪽(인디고)으로 남색 물들인 옷 · 손이 파랗게 물든 아주머니들 · <b>깟깟마을</b>이 흑몽족 마을</li><li><b>붉은 다오족 (Dao Đỏ)</b> · 빨간 두건이 상징 · 약초 목욕(herbal bath) 전통 · 따핀 마을</li><li><b>따이족·자이족·싸포족</b> · 무엉호아 계곡 아래쪽 마을(반호 등)에 살아</li><li><b>낀족</b> · 베트남 다수 민족 · 시내 상인·호텔 운영</li></ul></article><article class="lr-card"><h3>예의 & 알아두면 좋은 것</h3><ul class="lr-ul"><li>사진은 <b>먼저 물어보고</b> 찍기 · 아이들 사진도 마찬가지</li><li>아이들한테 물건 사지 않기 · 학교 대신 장사하게 만든다는 이유로 현지에서도 권장</li><li>트레킹 길에 몽족 아주머니들이 같이 걸어오다 마지막에 물건을 권하는 경우가 많아 · 필요 없으면 정중히 거절해도 돼</li><li><b>사랑 시장</b> · 원래 토요일 밤 젊은 남녀가 노래로 짝을 찾던 전통 · 지금은 공연 형태로 남아 있어</li></ul></article></div><div class="seg-panel" data-seg-of="ls" data-seg-id="nat"><article class="lr-card"><h3>자연·지형</h3><ul class="lr-ul"><li><b>판시판 (Fansipan)</b> · 해발 3,143m · “인도차이나의 지붕” · 정상까지 모노레일 → 케이블카 → 푸니쿨라 → 계단</li><li><b>무엉호아 계곡</b> · 사파 남쪽으로 길게 뻗은 계곡 · 계단식 논 전망과 트레킹 코스(라오짜이·따반)</li><li><b>깟깟마을</b> · 시내에서 걸어서 내려갈 수 있는 몽족 마을 · 폭포·물레방아 · 우리 숙소(깟깟 힐스) 바로 아래</li><li><b>오꾸이호 고개 · 헤븐 게이트</b> · 베트남에서 손꼽히는 고갯길 · 사랑폭포가 근처</li><li><b>운해</b> · 이른 아침 골짜기에 구름이 깔리는 풍경 · 맑은 날 아침 일찍이 확률 높아</li></ul><div class="lr-map" id="lr-map-sp" data-city="sp"></div></article></div><div class="seg-panel" data-seg-of="ls" data-seg-id="food"><article class="lr-card"><h3>사파에서 먹어볼 것</h3><ul class="lr-ul"><li><b>철갑상어 핫팟 (Lẩu cá tầm)</b> · 차가운 계곡물에서 기른 철갑상어·연어 · 사파 대표 음식</li><li><b>꼬치구이 (đồ nướng)</b> · 야시장의 고기·버섯·찰밥 꼬치 · 쌀쌀한 밤에 맥주랑</li><li><b>껌람 (Cơm lam)</b> · 대나무 통에 쪄낸 찰밥</li><li><b>훈제 물소고기 (Thịt trâu gác bế 김</b> — 10/15 22:10 확정 → &quot;2영업일 안에 이메일&quot;(10/16, 10/18) → &quot;조치 전 서면 답변&quot;(10/20) → &quot;17:00 전 확정&quot; → &quot;21:00까지 예/아니오&quot;(10/21). 지켜진 약속은 없고, 마지막에는 &quot;1~2일 더&quot;로 바뀌었습니다. <small>(R2 · R5 · R7 · R17 · R19 · R21 · R24)</small></li><li><b>여행 품질 하락과 보상 약속</b> — 차파(라운지 샤워·셔틀 포함)도 톤킨도 무산되어 하위 등급 열차로 바꿨습니다. 클룩은 &quot;확정되면 USD 86.87 차액 접수&quot;(16:50), &quot;취소되면 요금 차액뿐 아니라 여행 경험·시설 손실도 보상에 반영&quot;(18:58)이라고 안내했습니다. <small>(R19 · R21)</small></li></ol></div><div class="tr-calc"><b>📮 지금 클룩에 요구하는 것</b><ul><li>서면 보상안: 이미 안내받은 USD 86.87 차액과 셔틀 비용을 최소로 하고, 하위 등급으로 바뀌며 잃은 샤워 라운지·객실 등급과 추가 비용(샤워 시설 등)까지 반영 (R19 · R21)</li><li>서면 설명: 운영사와 연락한 기록이 없는데도 &quot;운영업체와 실시간 소통 중&quot;이라고 안내한 경위 (R19 · R22)</li></ul></div><h3 class="tr-h">1차 · 차파 익스프레스 (YMH387603)</h3><div class="ttable tr-cmp"><table><thead><tr><th>#</th><th>날짜·시각</th><th>우리가 문의·요청한 것</th><th>클룩 답변·조치</th></tr></thead><tbody><tr><td><b>R1</b></td><td>10/15<br><small>00:07</small></td><td>클룩에서 차파 익스프레스 4인실 4자리 + 셔틀 3장 결제 (USD 188.13)</td><td>예약 화면 안내: &quot;10/15 22:10(현지)까지 확정 예정&quot; <a href="evidence/klook-1015-status.jpg" target="_blank" rel="noopener">📎</a> <a href="evidence/klook-payment-detail.jpg" target="_blank" rel="noopener">📎</a></td></tr><tr class="hl"><td><b>R2</b></td><td>10/16<br><small>01:12</small></td><td>확정 기한이 지났는데 아직 대기 중이라 상태 확인 요청. 안 되면 같은 날 다른 객실·열차 안내 요청. 답이 올 때까지 취소하지 말아 달라고 함</td><td>운영사에 바로 확인하겠다고 함. 처음엔 &quot;안 되면 전액 환불&quot;이라 했다가 01:27 &quot;환불은 운영사 승인이 필요하다&quot;로 정정. 01:30 &quot;2영업일 안에 이메일로 결과를 보내겠다, 고객 답을 받을 때까지 취소·환불은 하지 않겠다&quot;고 하고 종료 <a href="evidence/kc-1016-0127.jpg" target="_blank" rel="noopener">📎</a> <a href="evidence/kc-1016-0130.jpg" target="_blank" rel="noopener">📎</a></td></tr><tr><td><b>R3</b></td><td>10/16<br><small>15:26</small></td><td>두 번째 문의. &quot;교통편이 안 되면 여행 전체가 틀어진다. 대안을 찾을 수 있게 처리를 앞당겨 달라. 다른 곳에서 예약하게 되면 무료 취소해 달라&quot;</td><td>15:34 &quot;업체 확정이 필요한 상품이라 업체에 재촉 중. 10/18 08:00(GMT+8)까지 확정 안 되면 자동 취소&quot;. 16:06 &quot;업체 연결이 늦어 직접 해결이 어렵다. 환불 확답은 못 하지만, 다른 곳에서 먼저 예약하면 환불되는지 관련 부서에 전달하겠다&quot; <a href="evidence/klook-1016-1534.jpg" target="_blank" rel="noopener">📎</a> <a href="evidence/klook-1016-1552.jpg" target="_blank" rel="noopener">📎</a> <a href="evidence/kc-1016-1606.jpg" target="_blank" rel="noopener">📎</a></td></tr><tr><td><b>R4</b></td><td>10/17<br><small>16:44</small></td><td>—</td><td>클룩이 먼저 안내: &quot;다른 곳 예약이 확정됐으면 알려 달라, 취소를 돕겠다. 10/18까지 확정 안 되면 자동 취소&quot; <a href="evidence/kc-1017-1644.jpg" target="_blank" rel="noopener">📎</a></td></tr><tr><td><b>R5</b></td><td>10/17<br><small>23:18</small></td><td>정식 민원. &quot;클룩은 같은 상품을 계속 팔고 광고하는데 결제한 내 예약만 확정이 안 된다.&quot; 기한 전 원래 금액으로 확정, 안 되면 다른 곳 예약 차액(셔틀 포함) 부담, 지연 이유 설명, 담당 부서 서면 답변 요청. 다른 곳 예약은 안 했으니 취소하지 말고 운영사에 전화로라도 확인해 달라고 함</td><td>23:34 &quot;24시간 안에 확정됐어야 했다&quot;며 사과하고 민원 기록. 상담원이 바뀐 뒤 &quot;예약팀에 긴급 요청했고 2영업일 안에 이메일로 안내&quot;. 기한이 몇 시간 뒤라고 하자 &quot;자동 취소 보류는 지금 확인해 드릴 수 없다&quot;. 차액 부담 요청은 &quot;검토·승인 대상으로 기록&quot; <a href="evidence/klook-1018-0003.jpg" target="_blank" rel="noopener">📎</a> <a href="evidence/kc-1018-0005.jpg" target="_blank" rel="noopener">📎</a> <a href="evidence/klook-1018-0019.jpg" target="_blank" rel="noopener">📎</a></td></tr><tr><td><b>R6</b></td><td>10/18–10/20<br><small></small></td><td>—</td><td>10/18 기한이 지나도 확정도 취소도 없이 대기 상태 유지. 이 채팅창에 클룩 쪽 안내 없음 </td></tr><tr class="hl"><td><b>R7</b></td><td>10/20<br><small>10:56</small></td><td>민원 뒤 이틀간 답이 없어 다시 문의. 확정이 안 되는 이유와 진행 상황 설명, 10/21 18:00까지 확정 또는 전액 환불 + 차액 보상, 보상 방식을 서면으로 먼저 알려 달라고 요청</td><td>11:21 &quot;운영업체 응답이 느려 강하게 재촉 중&quot;, &quot;마감 기한을 10월 20일까지로 연장했다&quot;, &quot;추가 조치 전에 이 채팅에서 서면으로 답하겠다&quot; <a href="evidence/kc-1020-1121-1.jpg" target="_blank" rel="noopener">📎</a> <a href="evidence/kc-1020-1121-2.jpg" target="_blank" rel="noopener">📎</a></td></tr><tr><td><b>R8</b></td><td>10/20<br><small>11:25</small></td><td>&quot;운영업체 탓으로 돌릴 일이 아니다. 보상안을 서면으로 받고 동의하기 전에는 취소·환불을 포함해 어떤 조치도 하지 말라&quot;</td><td>11:30 &quot;판매한 클룩에 책임이 있다는 지적을 확인했다&quot;. 차액 보상 812-2.jpg" target="_blank" rel="noopener">📎</a></td></tr></tbody></table></div><h3 class="tr-h">2차 · 톤킨 헤리티지 (UVP226059)</h3><div class="ttable tr-cmp"><table><thead><tr><th>#</th><th>날짜·시각</th><th>우리가 문의·요청한 것</th><th>클룩 답변·조치</th></tr></thead><tbody><tr><td><b>R14</b></td><td>10/21<br><small>00:39</small></td><td>클룩 안내대로 톤킨 헤리티지 인디고 4인실 4자리 결제 (USD 275)</td><td>예약 화면 안내: &quot;10/22 23:39(GMT+8)까지 확정 예정&quot; </td></tr><tr class="hl"><td><b>R15</b></td><td>10/21<br><small>01:04</small></td><td>대체 예약 사실과 1차 경위를 알림. 기한까지 기다리지 말고 바로 확인해 달라, 톤킨도 안 되면 낮은 등급밖에 없으니 경험 손실까지 보상해 달라고 요청</td><td>01:10 &quot;표준 기한(10/22)까지 기다리지 않겠다. 긴급 최우선으로 올렸고, 좌석을 확인하려고 운영업체에 직접 연락하고 있다. 남은 좌석을 놓치지 않게 하겠다&quot; <a href="evidence/kc-1021-0110.jpg" target="_blank" rel="noopener">📎</a></td></tr><tr><td><b>R16</b></td><td>10/21<br><small>오전~13시대</small></td><td>(톤킨 운영사에 WhatsApp으로 직접 문의)</td><td>10분 안에 답함: &quot;클룩 확정을 먼저 기다려 달라&quot;, &quot;우리 사이트가 실시간 재고&quot;. 운영사 사이트상 11/14 SP15·SP7 예약 불가 <a href="evidence/tonkin-wa-1021.jpg" target="_blank" rel="noopener">📎</a> <a href="evidence/tonkin-1114-soldout-1021.jpg" target="_blank" rel="noopener">📎</a> <a href="evidence/chapa-1114-sp15-na.jpg" target="_blank" rel="noopener">📎</a></td></tr><tr><td><b>R17</b></td><td>10/21<br><small>13:55</small></td><td>&quot;운영사는 클룩을, 클룩은 운영사를 기다리는 상황&quot;. 오늘 안에 확정 여부, 4자리 같은 칸 배정, 안 되면 바로 알려 달라고 요청. 3시간 안에 답해 달라고 함</td><td>&quot;이미 담당 부서에서 검토 중&quot;, &quot;오늘 안에 어려우면 취소하겠냐&quot;, &quot;48시간 안에 확정되는 상품&quot;. 오후 6시 안에 안내하겠다고 했다가, 한국 시간 17:00까지 요청하자 &quot;17:00 안에 다시 안내, 늦어지더라도 안내하겠다&quot; <a href="evidence/kc-1021-1355.jpg" target="_blank" rel="noopener">📎</a> <a href="evidence/kc-1021-1406.jpg" target="_blank" rel="noopener">📎</a></td></tr><tr><td><b>R18</b></td><td>10/21<br><small>16:39</small></td><td>17:00 기한 30분 전 진행 상황 확인</td><td>이미 환불된 1차 예약을 조회하고 &quot;다른 예약 문의가 맞냐&quot;고 되물음 </td></tr><tr class="hl"><td><b>R19</b></td><td>10/21<br><small>16:50</small></td><td>(상담원 교체, 이전 내역 확인 요청)</td><td>&quot;시니어 확정
