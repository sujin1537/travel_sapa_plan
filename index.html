/* ===== Decision board ===== */

.db-card{background:#fff;border-radius:18px;padding:16px;border:1px solid #ececf0}
.db-q{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}

.db-tag{background:#f1f1f3;color:#55565e}

.db-goto{margin-top:10px;background:none;border:0;padding:4px 0;font:inherit;font-size:12.5px;font-weight:800;color:var(--ink);cursor:pointer}

.day-subnav{top:var(--navh,52px)!important;background:#f6f6f7!important;margin:0 -2px 14px!important;padding:4px 2px 8px!important;border-radius:0!important;box-shadow:0 1px 0 #e6e6ea!important;z-index:19!important}

/* ===== Train compare ===== */

.tc-pick{margin-top:12px;background:var(--sun);border-radius:14px;padding:12px 14px}

.tc-pick p{margin:3px 0 0;font-size:13.5px;line-height:1.6}
.tc-src{margin:10px 0 0;font-size:11px;color:#8a8a94;line-height:1.6}
.tc-src a{color:#55565e}

.db-label{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:900;color:var(--pink);margin-bottom:8px}

.db-branch{margin-top:12px;padding:12px;border-radius:14px;background:#f6f6f7}

.db-branch-title{font-size:13px;font-weight:900}

.db-aside{margin-top:10px;border-radius:12px;background:#f6f6f7;padding:10px 12px}

.intro-vid{margin:6px 0 14px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}

.info-tips{margin:10px 0 0;padding-left:18px;font-size:13.5px;line-height:1.6}

.shop-note{font-size:13px;color:var(--muted);margin:0 0 10px;line-height:1.55}

 공항 픽업 03:45)."},{"day":3,"date":"11/15 일","place":"라오까이 → 사파","theme":"판시판 첫 트라이 · 깟깟마을 · 핫팟","summary":"사파 도착하자마자 날씨를 보고 맑으면 판시판부터. 흐리면 모아나·깟깟마을로 바꾸고 판시판은 다음 날 다시 트라이.","items":[["아침","라오까이역 → 사파 시내","열차 도착역은 사파가 아니라 라오까이. 사전 예약한 차량으로 약 1시간 이동."],["07:30","숙소에 짐 맡기기·아침 식사","체크인 전 짐 보관 가능 여부 확인. 정상은 추우니 패딩·핫팩은 작은 가방에 따로."],["08:00","판시판 날씨 체크","호텔 직원에게 오늘 정상 괜찮은지 묻고 썬월드 실시간 정상 날씨 확인. 맑으면 클룩으로 당일 구매 → 바로 출발. 흐리면 아래 플랜 B로."],["09:00–14:00","판시판 케이블카·정상","아침에 날씨 확인(호텔 직원 + 썬월드 실시간 정상 날씨) 후 클룩으로 당일 구매 — 미리 예매하면 환불 불가. 정상 트램(푸니쿨라)은 왕복으로. 사파역 10시 전 도착 추천, 왕복 4–5시간. 썬플라자 모노레일 → 케이블카 → 정상 푸니쿨라 → 43계단. 시내가 흐려도 정상은 갤 수 있고, 정상은 춥고 30분 만에 구름이 바뀌니 패딩 필수."],["14:30","늦은 점심","판시판 내려와서 시내에서 간단히. (플랜 B면 Moana Sapa를 오전에 먼저)"],["15:30","깟깟마을 · Peace's House 016 Cát Cát","Grab 목적지를 Peace's House 016 Cát Cát으로 설정. 입장료 약 7,800원 (150,000 VND). 계단·오르막 많아 편한 신발, 관람 2–3시간. 슬라이드·드론 비용은 현장 확인."],["저녁","철갑상어 핫팟","사파에서 가장 기대하는 메뉴 🔥 Sapa Emotion·Hotpot Center·Moment Romantic 중 선택. 3인분 가격·생선 중량 확인."],["저녁 이후","사파 야시장 산책","핫팟 후 사파 시내 야시장·광장 산책. 꼬치·군고구마 같은 간식과 기념품 구경."]],"decision":"08:00 날씨 확인(호텔 직원 + 썬월드 실시간 정상 날씨) → 맑으면 판시판 / 흐리면 Moana·깟깟마을 먼저 하고 판시판은 D4 오전으로. 티켓은 당일 클룩 구매(미리 사면 환불 불가)."},{"day":4,"date":"11/16 월","place":"사파","theme":"판시판 재도전(필요 시) · 모아나 · 자연 전망 · 카페","summary":"D3에 판시판을 못 갔으면 오전에 다시 트라이. 갔으면 Moana Sapa로 여유롭게 시작하고 오후엔 외곽 명소·뷰 카페.","items":[["오전","Moana Sapa","D3에 판시판을 다녀왔다면 오전 포토 스팟으로. 거대한 손·사파 스윙·판시판 뷰. (D3 판시판 실패 시엔 이 시간에 판시판 재도전)"],["점심","BB Restaurant 또는 시내 식사","반미 후보. 동선이 안 맞으면 시내에서 식사."],["오후","사랑폭포 또는 헤븐 게이트","날씨·차량 이동·도로 상황을 보고 한 곳 선택. 시간이 충분하면 둘 다."],["늦은 오후","전망 카페 (Viettrekking Coffee 등)","Viettrekking Coffee, Phansi Coffee Violet, Slope Cafe 등 인스타 추천 뷰 카페 중 선택."],["저녁","사파 저녁 식사","Little Sapa·CHUSU(풍향고), 어나이스, 시카고피자, India Gate 등에서 고르기."],["저녁 이후","Color Bar Sapa","또는 논뷰 칵테일 바 The Wildbeast. 당일 영업 확인."]],"decision":"D3 판시판 성공 → 오전 Moana Sapa / 실패 → 오전 판시판 재도전(Moana는 깟깟마을 근처라 D3 플랜 B 때 같이). 사랑폭포·헤븐 게이트는 날씨·체력 보고 선택."},{"day":5,"date":"11/17 화","place":"사파 → 하노이 → 공항"
