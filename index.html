/* Modern editorial refresh: cool white, ink navy, vivid blue */
:root{--bg:#f4f6fb;--paper:#ffffff;--ink:#172033;--muted:#737d91;--line:#e4e8f0;--green:#3659e3;--green2:#edf1ff;--lime:#dce7ff;--sand:#fff0e8;--orange:#f0784b;--blue:#edf5ff;--shadow:0 10px 30px rgba(29,43,77,.055)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;letter-spacing:-.012em}
a{color:var(--green)}
.shell{max-width:1180px;padding-top:28px}
.brand{color:#3659e3;letter-spacing:.13em}
.updated{font-variant-numeric:tabular-nums}
.hero{background:linear-gradient(120deg,#182342 0%,#273b72 55%,#3659e3 100%);border-radius:22px;padding:38px 38px;box-shadow:0 18px 42px rgba(40,61,128,.16)}
.hero:after{right:-30px;top:-150px;width:390px;height:390px;border-color:#ffffff2a;box-shadow:0 0 0 48px #ffffff0c,0 0 0 96px #ffffff08}
.hero h1{font-size:clamp(34px,5.3vw,56px);letter-spacing:-.055em}
.hero p{color:#d9e2ff}
.eyebrow{color:#b9c9ff}
.hero-stats{gap:9px}
.stat{background:#ffffff12;border:1px solid #ffffff2a;border-radius:9px;padding:9px 12px}
.mainnav{background:#e9edf7;border:1px solid #e0e5f1;border-radius:13px;box-shadow:0 5px 18px #1823420a;padding:4px}
.navbtn{border-radius:9px;color:#6a7489;padding:12px 14px}
.navbtn.active{color:#fff;background:#3659e3;box-shadow:0 4px 10px #3659e333}
.sectionhead{margin:32px 0 15px}
.sectionhead h2{font-size:23px;letter-spacing:-.045em}
.chip{background:#edf1ff;color:#3659e3;border-radius:7px;letter-spacing:.015em}
.card,.daycard,.option,.hotel,.foodcard,.placecard{border-color:#e4e8f0;border-radius:15px;box-shadow:0 5px 20px rgba(29,43,77,.035)}
.card{padding:21px}
.flight-icon{background:#edf1ff;color:#3659e3;border-radius:11px}
.daycard{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.daycard:hover{transform:translateY(-3px);border-color:#9caefb;box-shadow:0 12px 25px #263e8b12}
.daycard.selected{border:2px solid #3659e3;box-shadow:0 0 0 3px #3659e318}
.daytop{background:linear-gradient(135deg,#f7f8ff,#fff);border-bottom-color:#e9edf7}
.dayno{color:#3659e3}
.dayno span{background:#e9edff;color:#3659e3;border-radius:6px}
.daybody li:before{background:#8ea4ff}
.dayfoot{color:#3659e3}
.time{color:#3659e3}
.mini{border-color:#dfe5f5;border-radius:8px;color:#3659e3;transition:background .15s,border-color .15s}
.mini:hover{background:#edf1ff;border-color:#aebdf8}
.decision{background:#fff5ef;border-color:#ffe2d3;border-radius:11px;color:#8c4b2c}
.decision strong{color:#d7653c}

<article class="transport-card"><div class="transport-card-top"><span class="transport-badge">가장 빠른 연결</span><span>옵션 A1</span></div><h3>공항 01:30 출발 버스</h3><div class="transport-metrics"><div><small>예상 이동</small><b>약 6–7시간</b></div><div><small>가격 참고</small><b>약 400–500k VND</b></div></div><p>00:40 도착 항공편과 간격이 50분뿐이라 현실적으로 매우 촉박해. 입국심사·수하물·터미널 이동 중 하나만 늦어도 놓칠 수 있어.</p><div class="transport-verdict risk">추천도 낮음 · 지연 시 대응 가능한 티켓 조건이 있을 때만 검토</div></article>
<article class="transport-card featured"><div class="transport-card-top"><span class="transport-badge">직행 우선 후보</span><span>옵션 A2</span></div><h3>공항 픽업 03:45 전후 / 시내 사무실 04:00</h3><div class="transport-metrics"><div><small>예상 이동</small><b>약 5.5–7시간</b></div><div><small>가격 참고</small><b>약 400–500k VND</b></div></div><p>공항 픽업 시간이 실제로 운영되는지 확인해야 해. 시내 사무실 04:00 출발은 공항에서 택시로 이동해야 하므로 밤 시간 차량 예약과 이동 여유가 필요해.</p><div class="transport-verdict good">직행을 원한다면 이 시간대를 먼저 확인</div></article>
</div>
<div class="transport-subhead">옵션 B · 하노이에서 1박 후 야간열차</div><div class="transport-cards">
<article class="transport-card"><div class="transport-card-top"><span class="transport-badge">휴식 우선</span><span>옵션 B</span></div><h3>공항 → 하노이 숙소 → 저녁에 기차</h3><div class="transport-metrics"><div><small>기차 출발 참고</small><b>약 19:40–21:50</b></div><div><small>기차 요금 참고</small><b>약 300k–1,000k+ VND</b></div></div><p>도착 당일은 시내 숙소에서 쉬고 저녁에 하노이역에서 라오까이역으로 이동해. 침대 등급·운영사·4인실 단독 사용 여부에 따라 가격 차이가 커.</p><div class="transport-verdict">열차 도착 후 라오까이역 → 사파 시내까지 차량으로 약 1시간 추가</div></article>
<article class="transport-card"><div class="transport-card-top"><span class="transport-badge">열차 이용 시 필수</span><span>환승 단계</span></div><h3>라오까이역 → 사파 이동</h3><div class="transport-metrics"><div><small>차량 이동</small><b>약 1시간</b></div><div><small>추가 비용</small><b>차량·셔틀별 확인</b></div></div><p>기차가 사파에 도착하는 건 아니야. 라오까이역에서 셔틀·합승 밴·택시를 타고 사파까지 올라가야 하므로 열차표만 예약하면 이동이 끝나는 게 아니야.</p><div class="transport-verdict">3명이라면 역 픽업을 미리 예약하고 비용을 나눠 비교</div></article>
</div>
<div class="transport-note"><strong>간단 비교</strong><p>편리함은 사파 시내까지 이어지는 G8 직행버스가 유리하고, 잠을 자면서 이동하는 경험·4인실 단독 이용은 야간열차가 매력적이야. 다만 열차는 라오까이역 환승이 추가돼.</p><a href="https://vexere.com/en-US/g8-sapa-open-tour-bus-ticket-booking-from-hanoi-to-sa-pa-lao-cai-124t24241-39030.html" target="_blank" rel="noopener">G8 버스 시간·가격 확인 ↗</a> <a href="https://vietnam-railway.com/train/hanoi-sapa-timetable" target="_blank" rel="noopener">하노이–라오까이 열차 시간표 참고 ↗</a></div></div>
<div class="transport-section"><div class="sectionhead"><div><h2>2. 사파 → 하노이</h2><p>11/17 이동 · 귀국편이 11/18 01:45라 저녁 전 하노이 도착이 안전해</p></div><span class="chip">RETURN</span></div>
<div class="transport-cards">
<article class="transport-card featured"><div class="transport-card-top"><span class="transport-badge">우선 검토</span><span>옵션 C</span></div><h3>낮 버스 · 사파 시내에서 직행</h3><div class="transport-metrics"><div><small>시간대 참고</small><b>오전–14시대 출발</b></div><div><small>가격 참고</small><b>약 400–500k VND</b></div></div><p>약 5.5–7시간. 숙소나 시내 사무실에서 탑승할 수 있는 편을 고르면 역 환승이 없어 편리해. 11/17에는 늦어도 오후 초반 출발편을 우선 확인해 하노이 도착 후 공항 이동 여유를 확보하자.</p><div class="transport-verdict good">가장 단순한 동선 · 당일 버스 시간과 하노이 도착지를 확인</div></article>
<article class="transport-card"><div class="transport-card-top"><span class="transport-badge">주간 열차</span><span>옵션 D</span></div><h3>사파 → 라오까이역 → 낮 기차</h3><div class="transport-metrics"><div><small>열차 시간 참고</small><b>12:05 → 19:37</b></div><div><small>요금 참고</small><b>좌석 약 200k부터</b></div></div><p>사파에서 라오까이역까지 약 1시간 차량 이동 후 SP8 등 낮 열차를 이용하는 방식이야. 기차만 약 7시간 30분이라 역 이동과 대기까지 합치면 시간이 길어져. 귀국편 당일 연결은 열차 지연 위험 때문에 추천하지 않아.</p><div class="transport-verdict">열차 경험이 중요하다면 시간 여유를 두고 비교</div></article>
<article class="transport-card risk-card"><div class="transport-card-top"><span class="transport-badge">이번 일정엔 비추천</span><span>옵션 E</span></div><h3>야간열차 · 라오까이 21:00대 출발</h3><div class="transport-metrics"><div><small>시간표 예시</small><b>21:00 → 다음 날 05:15</b></div><div><small>요금 참고</small><b>침대 약 300k부터</b></div></div><p>일반적으로 야간열차가 있지만, 11/17 밤에 타면 하노이에 11/18 새벽 도착할 수 있어. 귀국 항공편은 이미 01:45에 출발하므로 이번 귀국 일정에는 사용할 수 없어.</p><div class="transport-verdict risk">11/17 사파 출발은 낮 버스 또는 낮 열차로 계획</div></article>
</div><div class="transport-note"><strong>귀국일 핵심</strong><p>11/17 밤에 하노이 시내에서 식사·마사지 후 공항으로 이동하는 계획이므로, 교통편은 하노이에 늦어도 저녁 시간대 도착하는 편으로 선택하자. 도로 정체와 버스 지연을 감안해 공항 도착 목표는 22:30 전후로 잡는 게 안전해.</p><a href="https://vexere.com/en-US/g8-sapa-open-tour-bus-ticket-booking-from-hanoi-to-thi-tran-sa-pa-124t21382031-39030.html" target="_blank" rel="noopener">사파–하노이 버스 시간 확인 ↗</a> <a href="https://vexere.com/vn/trains/from-lao-cai-to-ha-noi.482.24.en" target="_blank" rel="noopener">라오까이–하노이 기차 시간·요금 참고 ↗</a></div></div>
<div class="transport-section"><div class="sectionhead"><div><h2>3. 하노이 시내 → 공항</h2><p>노이바이공항은 구시가지 기준 약 25–30km 북쪽에 있어</p></div><span class="chip">AIRPORT TRANSFER</span></div><div class="transport-cards">
<article class="transport-card"><div class="transport-card-top"><span class="transport-badge">편하고 빠름</span><span>택시 / Grab</span></div><h3>차량 호출 또는 택시</h3><div class="transport-metrics"><div><small>소요 시간</small><b>약 35–60분</b></div><div><small>차량 비용</small><b>약 350k–500k VND</b></div></div><p>3명이 캐리어를 들고 움직일 때 가장 편해. 앱 호출은 출발 전 요금을 확인하고, 공항에서 호객하는 비공식 차량은 피하자.</p></article>
<article class="transport-card"><div class="transport-card-top"><span class="transport-badge">가성비</span><span>공항버스 86</span></div><h3>86번 공항버스</h3><div class="transport-metrics"><div><small>소요 시간</small><b>약 50–70분</b></div><div><small>1인 요금</small><b>약 45k–50k VND</b></div></div><p>하노이역과 공항을 연결하는 대표 공항버스야. 2026년 공개 시간표 기준 공항 출발은 대략 06:40–22:15, 하노이역 출발은 05:15–21:00이므로 심야 귀국편에는 운행 종료 시간을 확인해야 해.</p></article>
<article class="transport-card"><div class="transport-card-top"><span class="transport-badge">저렴하지만 제한</span><span>시내 일반버스</span></div><h3>7번·17번·90번 등</h3><div class="transport-metrics"><div><small>소요 시간</small><b>약 60–90분 이상</b></div><div><small>1인 요금</small><b>약 12k–15k VND</b></div></div><p>가장 저렴하지만 정류장과 숙소 사이 이동, 짐, 운행 종료 시간을 고려해야 해. 01:45 출발 국제선 공항 이동 수단으로는 적합하지 않아.</p></article>
</div><div class="transport-note"><strong>우리 일정에 맞춘 제안</strong><p>11/17 저녁에는 숙소나 식당에서 짐을 찾고, Grab 또는 예약 차량으로 공항까지 이동하는 편이 현실적이야. 3명이면 차량 1대 비용을 나눌 수 있어. 공항버스는 낮 시간에 시내로 들어갈 때 대안으로 두자.</p><a href="https://hanoibus.com/route/86-noi-bai-airport-city-center" target="_blank" rel="noopener">86번 버스 운행 정보 ↗</a> <a href="https://www.noibaiairport.vn/en/public-transportations-nid1.html" target="_blank" rel="noopener">노이바이공항 공식 교통 안내 ↗</a></div></div>

 document.querySelectorAll('[data-hotel-detail]').forEach(b=>b.addEventListener('click',()=>{const key=b.dataset.hotelDetail;const group=key.startsWith('h-')?'hanoi':'sapa';const idx=Number(key.slice(2));const h=hotelData[group][idx];if(!h)return;document.querySelectorAll('[data-hotel-detail]').forEach(x=>x.classList.toggle('active',x===b));const query=encodeURIComponent(h.name+' '+(group==='hanoi'?'Hanoi Vietnam':'Sapa Vietnam'));const official=safeUrl(h.url)?'<a href="'+esc(h.url)+'" target="_blank" rel="noopener">공식 사이트 ↗</a>':'';document.getElementById('hotel-detail-panel').innerHTML='<article class="hotel-detail-card"><span class="chip">'+(group==='hanoi'?'하노이 후보':'사파 후보')+'</span><h3>'+esc(h.name)+'</h3><p>'+esc(h.note)+'</p><dl class="restaurant-facts"><dt>가격대</dt><dd>2026년 11월 날짜·객실별 실시간 확인 필요</dd><dt>객실</dt><dd>성인 3명 투숙 가능 여부, 트리플룸 또는 엑스트라 베드 확인</dd><dt>확인 항목</dt><dd>창문/전망, 조식 포함, 무료 취소 기한, 세금·수수료, 체크인 시간</dd><dt>동선</dt><dd>'+(group==='hanoi'?'구시가지·식당 접근성 및 공항 이동':'사파 중심지 접근성 또는 셔틀/차량 이동')+'</dd></dl><div class="restaurant-actions">'+official+'<a href="https://www.google.com/maps/search/?api=1&query='+query+'" target="_blank" rel="noopener">Google 지도 ↗</a></div></article>';document.getElementById('hotel-detail-panel').scrollIntoView({behavior:'smooth',block:'start'})}));

 // Live VND -> KRW reference rate. Refresh every 30 minutes while the page stays open.
 const vndInput=document.getElementById('vnd-amount');
 const krwResult=document.getElementById('krw-result');
 const fxStatus=document.getElementById('fx-status');
 const fxRateNote=document.getElementById('fx-rate-note');
 let vndToKrw=0.055;
 let fxIsLive=false;
 const fmtKRW=n=>new Intl.NumberFormat('ko-KR',{style:'currency',currency:'KRW',maximumFractionDigits:0}).format(n);
 const fmtVND=n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:4}).format(n);
 function parseVnd(value){return Number(String(value).replace(/[^0-9]/g,''))||0}
 function renderFx(){const amount=Math.max(0,parseVnd(vndInput.value));krwResult.textContent=fmtKRW(amount*vndToKrw);fxRateNote.textContent=(fxIsLive?'기준 환율: 1 VND ≈ '+vndToKrw.toFixed(5)+' KRW':'임시 참고 환율: 1 VND ≈ 0.055 KRW')+' · 실제 환전·카드 수수료에 따라 달라질 수 있어.'}
 async function refreshFx(){try{fxStatus.textContent='환율 업데이트 중';const res=await fetch('https://open.er-api.com/v6/latest/VND',{cache:'no-store'});if(!res.ok)throw new Error('FX request failed');const data=await res.json();const rate=Number(data?.rates?.KRW);if(!Number.isFinite(rate)||rate<=0)throw new Error('Invalid KRW rate');vndToKrw=rate;fxIsLive=true;fxStatus.textContent='기준 환율 · '+(data.time_last_update_utc?new Date(data.time_last_update_utc).toLocaleDateString('ko-KR'):'업데이트됨');renderFx()}catch(e){fxStatus.textContent='실시간 환율 연결 실패';renderFx()}}
 vndInput.addEventListener('input',()=>{const digits=String(vndInput.value).replace(/[^0-9]/g,'');const formatted=digits?Number(digits).toLocaleString('en-US'):'';vndInput.value=formatted;renderFx()});renderFx();refreshFx();setInterval(refreshFx,30*60*1000);

 document.querySelectorAll('[data-decision-goto]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();goView(a.dataset.decisionGoto)}));
