/* Modern editorial refresh: cool white, ink navy, vivid blue */
:root{--bg:#f4f6fb;--paper:#ffffff;--ink:#172033;--muted:#737d91;--line:#e4e8f0;--green:#3659e3;--green2:#edf1ff;--lime:#dce7ff;--sand:#fff0e8;--orange:#f0784b;--blue:#edf5ff;--shadow:0 10px 30px rgba(29,43,77,.055)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;letter-spacing:-.012em}
a{color:var(--green)}
.shell{max-width:1180px;padding-top:28px}
.brand{color:#3659e3;letter-spacing:.13em}
.updated{font-variant-numeric:tabular-nums}
.hero{background:linear-gradient(120deg,#182342 0%,#273b72 55%,#3659e3 100%);border-radius:22px;padding:38px 38px;box-shadow:0 18px 42px rgba(40,61,128,.16)}
.hero:after{right:-30px;top:-150px;width:390px;height:390px;border-color:#ffffff2a;box-shadow:0 0 0 48px #ffffff0c,0 0 0 96px #ffffff08}
.hero h1{font-size:clamp(34px,5.3vw,56px);letter-spacing:-.055em}
.hero p{color:#d9e2ff}
.eyebrow{color:#b9c9ff}
.hero-stats{gap:9px}
.stat{background:#ffffff12;border:1px solid #ffffff2a;border-radius:9px;padding:9px 12px}
.mainnav{background:#e9edf7;border:1px solid #e0e5f1;border-radius:13px;box-shadow:0 5px 18px #1823420a;padding:4px}
.navbtn{border-radius:9px;color:#6a7489;padding:12px 14px}
.navbtn.active{color:#fff;background:#3659e3;box-shadow:0 4px 10px #3659e333}
.sectionhead{margin:32px 0 15px}
.sectionhead h2{font-size:23px;letter-spacing:-.045em}
.chip{background:#edf1ff;color:#3659e3;border-radius:7px;letter-spacing:.015em}
.card,.daycard,.option,.hotel,.foodcard,.placecard{border-color:#e4e8f0;border-radius:15px;box-shadow:0 5px 20px rgba(29,43,77,.035)}
.card{padding:21px}
.flight-icon{background:#edf1ff;color:#3659e3;border-radius:11px}
.daycard{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.daycard:hover{transform:translateY(-3px);border-color:#9caefb;box-shadow:0 12px 25px #263e8b12}
.daycard.selected{border:2px solid #3659e3;box-shadow:0 0 0 3px #3659e318}
.daytop{background:linear-gradient(135deg,#f7f8ff,#fff);border-bottom-color:#e9edf7}
.dayno{color:#3659e3}
.dayno span{background:#e9edff;color:#3659e3;border-radius:6px}
.daybody li:before{background:#8ea4ff}
.dayfoot{color:#3659e3}
.time{color:#3659e3}
.mini{border-color:#dfe5f5;border-radius:8px;color:#3659e3;transition:background .15s,border-color .15s}
.mini:hover{background:#edf1ff;border-color:#aebdf8}
.decision{background:#fff5ef;border-color:#ffe2d3;border-radius:11px;color:#8c4b2c}

"items":[["아침","라오까이역 → 사파 시내","열차 도착역은 사파가 아니라 라오까이. 사전 예약한 차량으로 약 1시간 이동(실제 시간 확인)."],["오전","숙소에 짐 맡기기·아침 식사","체크인 전 짐 보관 가능 여부 확인. 체력 회복을 위해 간단히 식사."],["오전","Moana Sapa","깟깟마을보다 먼저 방문하는 포토 스팟. 산과 무옹화 계곡 전망을 즐기고 사진 촬영."],["늦은 오전–오후","깟깟마을 · Peace's House 016 Cát Cát","Grab 목적지를 Peace's House 016 Cát Cát으로 설정. 입장료 약 150,000 VND 메모, 슬라이드·드론 비용은 현장 재확인. 마을 안쪽의 하울의 움직이는 성을 떠올리게 하는 전망 포인트도 놓치지 않기."],["오후","깟깟마을 산책·사진","계단과 오르막이 있어 편한 신발 착용. 마을 관람은 약 2–3시간, 사진·의상 대여 시 더 여유 있게."],["늦은 오후 (선택)","함종산 전망대","지구놀이터 코스처럼 깟깟마을 다음에 넣는 전망 포인트. 체력이 남고 날씨가 맑을 때만, 일몰 전 운영시간 확인."],["저녁","철갑상어 핫팟","사파에서 가장 기대하는 메뉴로 우선순위 높게 배치. Sapa Emotion Restaurant·Hotpot Center Sapa 후보의 3인분 가격, 생선 중량, 최신 영업 정보를 확인."],["저녁 이후","사파 야시장 산책","핫팟 후 사파 시내 야시장·광장 산책(지구놀이터 1일차 코스). 꼬치·군고구마 같은 간식과 기념품 구경."]],"decision":"야간열차 도착 지연이나 피로가 크면 Moana·깟깟마을만 진행하고 판시판은 11/16으로 조정. 입장료·슬라이드·드론 가격은 현장 확인."},{"day":4,"date":"11/16 월","place":"사파","theme":"판시판 · 자연 전망 · 카페","summary":"날씨가 좋을 때 판시판을 우선하고, 외곽 명소는 이동·체력에 따라 한 곳 또는 두 곳을 선택.","items":[["오전","판시판 케이블카·정상","구름과 날씨를 확인하고 운행 시간·왕복권·무엉화 산악열차 연계 여부 확인. 전날 일정이 밀리면 이날을 판시판 우선일로 사용."],["점심","BB Restaurant 또는 시내 식사","지구놀이터 코스에서 언급된 반미 후보. 정확한 지점과 반미 제공 여부를 확인하고 동선이 안 맞으면 시내에서 식사."],["오후","사랑폭포 또는 헤븐 게이트","두 곳 모두 무리하게 넣기보다 날씨·차량 이동·도로 상황을 보고 우선순위 선택. 시간이 충분하면 둘 다 검토."],["늦은 오후","전망 좋은 루프탑 카페","계단식 논·산 전망 카페를 찾아 쉬는 시간 확보. Phansi Coffee Violet·Slope Cafe 등 메모한 후보는 위치와 영업 여부 확인."],["저녁","사파 저녁 식사","철갑상어 핫팟을 전날 먹었다면 무제한 삼겹살 또는 Yummy Sapa의 코코넛 커리·볶음밥 후보를 비교. 경치 좋은 볶음밥 식당은 실제 위치·전망 사진 확인 후 선택."],["저녁 이후","Color Bar Sapa","56 Fansipan으로 메모된 바 후보. 저녁 후 분위기를 즐기는 선택 일정이며 당일 영업·음료 가격을 확인."]],"decision":"판시판과 외곽 명소를 모두 소화하려고 무리하지 말 것. 사랑폭포·헤븐 게이트는 날씨와 이동시간에 따라 선택."},{"day":5,"date":"11/17 화","place":"사파 → 하노이 → 공항","theme":"하노이 음식 탐방 · 휴식 · 귀국 준비","summary":"낮에 사파를 떠나 하노이에서 음식 탐방과 휴식을 하고, 밤에 공항으로 이동. 11/17 숙박은 기본 일정에 없음.","items":[["오전","사파 체크아웃·하노이행 버스","귀국편이 11/18 01:45이므로 늦은 출발은 피하고 오전–이른 오후 출발편을 우선 확인. 도로 지연 버퍼 확보."],["오후","하노이 도착·짐 보관","버스 도착지와 짐 보관 장소를 먼저 확정. 짐을 찾는 시간을 포함해 <div class="transport-section"><div class="sectionhead"><div><h2>1. 하노이 → 사파</h2><p>11/14 이동 · 버스 직행 또는 하노이 1박 후 야간열차</p></div><span class="chip">OUTBOUND</span></div>
<div class="transport-subhead">옵션 A · 비행기 내리자마자 사파행 버스 (G8 Open Tour · 11/14 토)</div><div class="transport-cards">

<article class="transport-card featured"><div class="transport-card-top"><span class="transport-badge">직행 1순위</span><span>옵션 A2</span></div><h3>공항 픽업 03:45 · 국제선 T2에서 바로 탑승</h3><div class="transport-metrics"><div><small>사파 도착</small><b>08:45–09:15 예상</b></div><div><small>탑승 위치</small><b>T2 1층 Hall A1 · 1번 기둥</b></div></div><p><b>G8 공식 공항 시간표</b>에 있는 편(하노이 03:15 출발 → 공항 03:45 픽업). 착륙 후 약 3시간 여유가 있어 입국심사·짐 찾기·유심·환전까지 하고 공항에서 기다리면 돼. 시내로 나갈 필요 없음.</p><div class="transport-verdict good">우리 일정에 가장 현실적 · 공항에서 3시간 대기 각오</div></article>
<article class="transport-card"><div class="transport-card-top"><span class="transport-badge">시내 출발</span><span>옵션 A3</span></div><h3>시내 03:20 (01 Lê Lai) / 04:00 (105 Hoàng Quốc Việt)</h3><div class="transport-metrics"><div><small>사파 도착</small><b>약 09:36–09:41</b></div><div><small>근거</small><b>Vexere 시간표</b></div></div><p>공항에서 Grab으로 시내 승차장까지 이동해야 해(새벽 30–40분). 받은 메모의 <b>160 Trần Quang Khải 04:00</b>은 확인한 시간표에선 안 보였어 — 이곳은 00:30·11:30편만 표시돼. 공항 픽업(A2)이 있으니 굳이 시내로 갈 이유는 적어.</p><div class="transport-verdict">A2가 매진일 때 대안</div></article>
</div>
<div class="transport-note"><strong>G8 요금 · 3명 조합</strong><p>VIP 캐빈 버스(22–24석). 1인 캐빈 2층 <b>450,000 VND</b> · 1층 <b>530,000 VND</b> · 2인 캐빈 <b>780,000 VND</b>(공식 페이지 "부터" 가격). 3명이면 <b>2인 캐빈 1 + 1인 캐빈 1 ≈ 1,230,000–1,310,000 VND(약 6.4–6.8만 원)</b>. 사파 하차: G8 사파 사무소(Nguyễn Đăng Khuê 거리, 새 버스터미널 맞은편) · 사무소 반경 5km 내 숙소 앞 하차 가능.</p></div>
<div class="transport-note"><strong>예약 전 꼭 확인할 5가지</strong><p>① 11/14 성인 3명 실제 운행 시간·잔여 좌석 ② 새벽 1시대·4시대 각각 정확한 출발 장소 ③ 국제선 터미널 픽업 장소·실제 픽업 시각 ④ 항공편 지연 시 변경·환불 가능 여부 ⑤ 사파 도착 후 숙소 짐 보관 가능 여부<br><a href="https://g8opentour.com/san-bay-noi-bai-sapa" target="_blank" rel="noopener">G8 공항 → 사파 ↗</a> · <a href="https://g8opentour.com/ha-noi-sapa" target="_blank" rel="noopener">G8 하노이 → 사파 ↗</a> · <a href="https://vexere.com/en-US/g8-sapa-open-tour-bus-ticket-booking-from-ha-noi-to-sa-pa-lao-cai-124t24241-39030.html" target="_blank" rel="noopener">Vexere 예약 ↗</a> · 문의 Zalo/WhatsApp 0962 645 611</p></div>

</div>

<div class="transport-cards">
<article class="transport-card featured"><div class="transport-card-top"><span class="transport-badge">우선 검토</span><span>옵션 C</span></div><h3>낮 버스 · 사파 시내에서 직행</h3><div class="transport-metrics"><div><small>시간대 참고</small><b>오전–14시대 출발</b></div><div><small>가격 참고</small><b>약 400,000–500,000 VND (약 22,000–28,000원)</b></div></div><p>약 5.5–7시간. 숙소나 시내 사무실에서 탑승할 수 있는 편을 고르면 역 환승이 없어 편리해. 11/17에는 늦어도 오후 초반 출발편을 우선 확인해 하노이 도착 후 공항 이동 여유를 확보하자.</p><div class="transport-verdict good">가장 단순한 동선 · 당일 버스 시간과 하노이 도착지를 확인</div></article>
<article class="transport-card"><div class="transport-card-top"><span class="transport-badge">주간 열차</span><span>옵션 D</span></div><h3>사파 → 라오까이역 → 낮 기차</h3><div class="transport-metrics"><div><small>열차 시간 참고</small><b>12:05 → 19:37</b></div><div><small>요금 참고</small><b>좌석 약 200k부터</b></div></div><p>사파에서 라오까이역까지 약 1시간 차량 이동 후 SP8 등 낮 열차를 이용하는 방식이야. 기차만 약 7시간 30분이라 역 이동과 대기까지 합치면 시간이 길어져. 귀국편 당일 연결은 열차 지연 위험 때문에 추천하지 않아.</p><div class="transport-verdict">열차 경험이 중요하다면 시간 여유를 두고 비교</div></article>
<article class="transport-card risk-card"><div class="transport-card-top"><span class="transport-badge">이번 일정엔 비추천</span><span>옵션 E</span></div><h3>야간열차 · 라오까이 21:00대 출발</h3><div class="transport-metrics"><div><small>시간표 예시</small><b>21:00 → 다음 날 05:15</b></div><div><small>요금 참고</small><b>침대 약 300k부터</b></div></div><p>일반적으로 야간열차가 있지만, 11/17 밤에 타면 하노이에 11/18 새벽 도착할 수 있어. 귀국 항공편은 이미 01:45에 출발하므로 이번 귀국 일정에는 사용할 수 없어.</p><div class="transport-verdict risk">11/17 사파 출발은 낮 버스 또는 낮 열차로 계획</div></article>
</div><div class="transport-note"><strong>귀국일 핵심</strong><p>11/17 밤에 하노이 시내에서 식사·마사지 후 공항으로 이동하는 계획이므로, 교통편은 하노이에 늦어도 저녁 시간대 도착하는 편으로 선택하자. 도로 정체와 버스 지연을 감안해 공항 도착 목표는 22:30 전후로 잡는 게 안전해.</p><a href="https://vexere.com/en-US/g8-sapa-open-tour-bus-ticket-booking-from-hanoi-to-thi-tran-sa-pa-124t21382031-39030.html" target="_blank" rel="noopener">사파–하노이 버스 시간 확인 ↗</a> <a href="https://vexere.com/vn/trains/from-lao-cai-to-ha-noi.482.24.en" target="_blank" rel="noopener">라오까이–하노이 기차 시간·요금 참고 ↗</a></div></div>
<div class="transport-section"><div class="sectionhead"><div><h2>3. 하노이 시내 → 공항</h2><p>노이바이공항은 구시가지 기준 약 25–30km 북쪽에 있어</p></div><span class="chip">AIRPORT TRANSFER</span></div><div class="transport-cards">
<article class="transport-card"><div class="transport-card-top"><span class="transport-badge">편하고 빠름</span><span>택시 / Grab</span></div><h3>차량 호출 또는 택시</h3><div class="transport-metrics"><div><small>소요 시간</small><b>약 35–60분</b></div><div><small>차량 비용</small><b>약 350,000–500,000 VND (약 19,000–28,000원)</b></div></div><p>3명이 캐리어를 들고 움직일 때 가장 편해. 앱 호출은 출발 전 요금을 확인하고, 공항에서 호객하는 비공식 차량은 피하자.</p></article>

 const fmtKRW=n=>new Intl.NumberFormat('ko-KR',{style:'currency',currency:'KRW',maximumFractionDigits:0}).format(n);
 const fmtVND=n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:4}).format(n);
 function parseVnd(value){return Number(String(value).replace(/[^0-9]/g,''))||0}
 function renderFx(){const amount=Math.max(0,parseVnd(vndInput.value));krwResult.textContent=fmtKRW(amount*vndToKrw);fxRateNote.textContent=(fxIsLive?'기준 환율: 1 VND ≈ '+vndToKrw.toFixed(5)+' KRW':'임시 참고 환율: 1 VND ≈ 0.055 KRW')+' · 실제 환전·카드 수수료에 따라 달라질 수 있어.'}
 async function refreshFx(){try{fxStatus.textContent='환율 업데이트 중';const res=await fetch('https://open.er-api.com/v6/latest/VND',{cache:'no-store'});if(!res.ok)throw new Error('FX request failed');const data=await res.json();const rate=Number(data?.rates?.KRW);if(!Number.isFinite(rate)||rate<=0)throw new Error('Invalid KRW rate');vndToKrw=rate;fxIsLive=true;fxStatus.textContent='기준 환율 · '+(data.time_last_update_utc?new Date(data.time_last_update_utc).toLocaleDateString('ko-KR'):'업데이트됨');renderFx()}catch(e){fxStatus.textContent='실시간 환율 연결 실패';renderFx()}}
 vndInput.addEventListener('input',()=>{const digits=String(vndInput.value).replace(/[^0-9]/g,'');const formatted=digits?Number(digits).toLocaleString('en-US'):'';vndInput.value=formatted;renderFx()});renderFx();refreshFx();setInterval(refreshFx,30*60*1000);

 document.querySelectorAll('[data-decision-goto]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();goView(a.dataset.decisionGoto)}));
 document.getElementById('day-subnav').classList.add('visible');
 if(d.itinerary&&d.itinerary.length)showDay(1,true);
}
document.addEventListener('error',function(e){
 const img=e.target;if(!img||img.tagName!=='IMG')return;
 img.style.display='none';
 img.parentElement?.classList.add('photo-missing');
 const note=document.createElement('span');
 note.className='photo-load-error';
 note.textContent='사진을 불러오지 못했어 · 지도에서 실제 장소 사진 확인';
 img.parentElement?.appendChild(note);
},true);
init().catch(err=>{document.getElementById('app').innerHTML='<article class="card"><h2>화면을 불러오지 못했어.</h2><p>새로고침 후에도 문제가 있으면 오류를 확인해야 해.</p></article>';console.error(err)});
</script>
