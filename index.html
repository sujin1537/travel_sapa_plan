/* Modern editorial refresh: cool white, ink navy, vivid blue */
:root{--bg:#f4f6fb;--paper:#ffffff;--ink:#172033;--muted:#737d91;--line:#e4e8f0;--green:#3659e3;--green2:#edf1ff;--lime:#dce7ff;--sand:#fff0e8;--orange:#f0784b;--blue:#edf5ff;--shadow:0 10px 30px rgba(29,43,77,.055)}

a{color:var(--green)}
.shell{max-width:1180px;padding-top:28px}
.brand{color:#3659e3;letter-spacing:.13em}

.navbtn.active{color:#fff;background:#3659e3;box-shadow:0 4px 10px #3659e333}
.sectionhead{margin:32px 0 15px}
.sectionhead h2{font-size:23px;letter-spacing:-.045em}
.chip{background:#edf1ff;color:#3659e3;border-radius:7px;letter-spacing:.015em}
.card,.daycard,.option,.hotel,.foodcard,.placecard{border-color:#e4e8f0;border-radius:15px;box-shadow:0 5px 20px rgba(29,43,77,.035)}
.card{padding:21px}
.flight-icon{background:#edf1ff;color:#3659e3;border-radius:11px}
.daycard{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.daycard:hover{transform:translateY(-3px);border-color:#9caefb;box-shadow:0 12px 25px #263e8b12}
.daycard.selected{border:2px solid #3659e3;box-shadow:0 0 0 3px #3659e318}
.daytop{background:linear-gradient(135deg,#f7f8ff,#fff);border-bottom-color:#e9edf7}
.dayno{color:#3659e3}
.dayno span{background:#e9edff;color:#3659e3;border-radius:6px}
.daybody li:before{background:#8ea4ff}
.dayfoot{color:#3659e3}
.time{color:#3659e3}
.mini{border-color:#dfe5f5;border-radius:8px;color:#3659e3;transition:background .15s,border-color .15s}
.mini:hover{background:#edf1ff;border-color:#aebdf8}
.decision{background:#fff5ef;border-color:#ffe2d3;border-radius:11px;color:#8c4b2c}
.decision strong{color:#d7653c}
.detailtab.active{background:#3659e3;border-color:#3659e3}
.option.featured{border:2px solid #3659e3;background:#f8f9ff}
.option h4{color:#3659e3}
.checklist li:before{background:#edf1ff;color:#3659e3}
.foodcard .where{color:#e16d43}
.status{color:#4e61a8;background:#eef1ff}
.callout{background:#edf5ff;color:#425875;border:1px solid #e1edff}
.foot{border-top:1px solid #e4e8f0;padding-top:18px}
@media(max-width:760px){.shell{padding-top:14px}.hero{padding:27px 22px;border-radius:18px}.card{padding:16px}.sectionhead{margin-top:27px}}


/* Photo-led day cards */
.photo-daylist .daycard{position:relative;display:block;width:100%;text-align:left;padding:0;overflow:hidden;background:#fff;border-radius:17px}
.dayphoto{height:154px;position:relative;overflow:hidden;background:#e6eaf2}
.dayphoto img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.daycard:hover .dayphoto img{transform:scale(1.045)}
.dayphoto-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,20,42,.04) 20%,rgba(12,20,42,.5) 100%);pointer-events:none}
.dayphoto-label{position:absolute;left:14px;bottom:12px;color:#fff;font-size:12px;font-weight:900;letter-spacing:.12em;text-shadow:0 1px 8px #10172a80}
.photocredit{position:absolute;right:9px;bottom:9px;z-index:2;color:#fff!important;font-size:10px;font-weight:700;background:#17203380;padding:5px 7px;border-radius:6px;backdrop-filter:blur(6px)}
.photo-daylist .daytop{padding-top:13px}
@media(max-width:760px){.dayphoto{height:125px}.photo-daylist .daycard{border-radius:13px}}

  <div class="flightgrid">${d.flights.map(f=>'<article class="card flight"><div class="flight-icon">✈</div><div><div class="kicker">'+esc(f.label)+' · '+esc(f.date)+'</div><h3>'+esc(f.route)+'</h3><p>'+esc(f.flight)+' · '+esc(f.time)+'</p></div></article>').join('')}</div>
  <div class="sectionhead"><div><h2>여행 일정</h2><p>각 Day를 눌러 타임라인과 결정할 사항을 확인해.</p></div></div>
  <div class="daylist photo-daylist" id="daylist">${(d.itinerary||[]).map(day=>{const photos={1:{file:'Hanoi_Noi_Bai_airport.jpg',page:'https://commons.wikimedia.org/wiki/File:Hanoi_Noi_Bai_airport.jpg',alt:'하노이 노이바이 공항'},2:{file:'Rice_terraces_in_Sapa,_Vietnam.jpg',page:'https://commons.wikimedia.org/wiki/File:Rice_terraces_in_Sapa,_Vietnam.jpg',alt:'사파 계단식 논'},3:{file:'Fansipan_cable_car_terraced_rice_fields_valley_aerial_view_Sa_Pa_Vietnam.jpg',page:'https://commons.wikimedia.org/wiki/File:Fansipan_cable_car_terraced_rice_fields_valley_aerial_view_Sa_Pa_Vietnam.jpg',alt:'판시판 케이블카와 산악 풍경'},4:{file:'Cat_Cat_Waterfalls,_Sa_Pa,_Vietnam,_20240126_1228_3619.jpg',page:'https://commons.wikimedia.org/wiki/File:Cat_Cat_Waterfalls,_Sa_Pa,_Vietnam,_20240126_1228_3619.jpg',alt:'깟깟마을 폭포'},5:{file:'Street_food_in_Hanoi.jpg',page:'https://commons.wikimedia.org/wiki/File:Street_food_in_Hanoi.jpg',alt:'하노이 길거리 음식'},6:{file:'Vietnam_hanoi_old_quarter.jpg',page:'https://commons.wikimedia.org/wiki/File:Vietnam_hanoi_old_quarter.jpg',alt:'하노이 구시가지'}};const p=photos[day.day]||photos[2];return '<button class="daycard" data-day="'+day.day+'"><div class="dayphoto"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(p.file).replace(/%2C/g,',')+'?width=900" alt="'+esc(p.alt)+'" loading="lazy"><span class="dayphoto-shade"></span><span class="dayphoto-label">DAY '+String(day.day).padStart(2,'0')+'</span><a class="photocredit" href="'+p.page+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">사진 출처 ↗</a></div><div class="daytop"><div class="dayno"><span>'+esc(day.date)+'</span></div><h3>'+esc(day.place)+'</h3><p>'+esc(day.theme)+'</p></div><div class="daybody"><div class="muted">'+esc(day.summary)+'</div><ul>'+day.items.slice(0,3).map(i=>'<li>'+esc(i[1])+'</li>').join('')+'</ul><div class="dayfoot"><span>일정 상세 보기</span><span>↗</span></div></div></button>'}).join('')}</div>
  <div id="daydetail" class="daydetail"></div>
  <div class="sectionhead"><div><h2>먼저 결정할 것</h2><p>아직 확정하지 않은 선택지만 따로 모았어.</p></div></div>
  <div class="grid"><article class="card"><span class="chip">DECISION 01</span><h3>하노이 도착 후 사파 이동</h3><p class="intro">01:30 공항 버스 / 04:00 시내 버스 / 하노이 휴식 후 야간열차</p><button class="mini" data-goto="transport">이동 옵션 비교하기 →</button></article><article class="card"><span class="chip">DECISION 02</span><h3>사파 숙소와 숙박 박수</h3><p class="intro">버스안은 사파 3박, 열차안은 사파 2박과 하노이 첫날 휴식을 검토.</p><button class="mini" data-goto="lodging">숙소 후보 보기 →</button></article></div>
 </section>
 <section id="view-transport" class="view"><div class="sectionhead"><div><h2>이동 계획</h2><p>출발 시간보다 중요한 건 실제 픽업 위치와 연결 여유야.</p></div><span class="chip">COMPARE</span></div><p class="intro">${esc(d.detailTabs.transport.intro)}</p><div class="optiongrid">${d.detailTabs.transport.options.map(o=>'<article class="option '+(o.id==='B'?'featured':'')+'"><span class="chip">OPTION '+esc(o.id)+'</span><h3>'+esc(o.name)+'</h3><div class="muted">'+esc(o.tag)+'</div><h4>장점</h4><ul>'+o.pros.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><h4>주의점</h4><ul>'+o.cons.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><div class="decision"><strong>결정 기준</strong>'+esc(o.decision)+'</div></article>').join('')}</div><div class="sectionhead"><div><h2>예약 전 체크</h2><p>운송사에 확인하고 난 뒤 예약 상태를 확정하자.</p></div></div><article class="card"><ul class="checklist">'+d.detailTabs.transport.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul><div class="event-actions"><a class="mini" href="'+esc(d.transport.g8Url)+'" target="_blank" rel="noopener">G8 노선 확인 ↗</a><a class="mini" href="'+esc(d.transport.contactUrl)+'" target="_blank" rel="noopener">G8 문의 ↗</a></div></article></section>
 <section id="view-lodging" class="view"><div class="sectionhead"><div><h2>숙박 후보</h2><p>3인실 · 청결 · 위치 · 합리적인 가격을 기준으로 비교</p></div><span class="chip">NOT BOOKED</span></div><p class="intro">${esc(d.detailTabs.lodging.intro)}</p><div class="split"><article class="card"><h3 class="subhead">하노이</h3><div class="hotelgrid">${d.detailTabs.lodging.hanoi.map(h=>'<div class="hotel"><h4>'+esc(h.name)+'</h4><p>'+esc(h.note)+'</p>'+a(h.url,'공식 사이트')+'</div>').join('')}</div></article><article class="card"><h3 class="subhead">사파</h3><div class="hotelgrid">${d.detailTabs.lodging.sapa.map(h=>'<div class="hotel"><h4>'+esc(h.name)+'</h4><p>'+esc(h.note)+'</p>'+a(h.url,'공식 사이트')+'</div>').join('')}</div></article></div><div class="sectionhead"><div><h2>예약 결정 체크리스트</h2><p>여정 선택에 따라 숙박일이 달라져.</p></div></div><article class="card"><ul class="checklist">${d.detailTabs.lodging.decisions.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></article></section>
 <section id="view-food" class="view"><div class="sectionhead"><div><h2>음식 노트</h2><p>하노이는 음식 탐방 시간을 넉넉히, 사파는 철갑상어 샤브샤브를 우선.</p></div><span class="chip">FOOD FIRST</span></div><p class="intro">${esc(d.detailTabs.food.intro)}</p><div class="foodcards">${d.detailTabs.food.priorities.map((f,i)=>'<article class="foodcard"><div class="foodicon">'+['🍜','♨','🥓'][i%3]+'</div><h3>'+esc(f.title)+'</h3><p>'+esc(f.detail)+'</p><span class="where">'+esc(f.where)+'</span></article>').join('')}</div><div class="callout">${esc(d.detailTabs.food.note)}</div></section>
 <section id="view-sights" class="view"><div class="sectionhead"><div><h2>볼 것 · 할 것</h2><p>날씨와 체력에 따라 순서를 바꿀 수 있도록 명소별로 분리했어.</p></div><span class="chip">FLEXIBLE</span></div><div class="placegrid">${[
 {name:'판시판',day:'DAY 03 · 11/15',desc:'케이블카와 산 정상 전망. 날씨가 좋을 때 우선 배치.',status:'날씨 확인'},
 {name:'무엉화 산악열차',day:'DAY 03 · 11/15',desc:'판시판 이동 동선과 운영시간을 함께 확인.',status:'운영 확인'},
 {name:'깟깟마을',day:'DAY 03 · 11/15',desc:'오르내리는 구간이 있어 체력과 날씨 고려.',status:'동선 조정'},
 {name:'사랑폭포',day:'DAY 04 · 11/16',desc:'시내 밖 이동이 필요할 수 있어 교통편을 먼저 정하기.',status:'교통 확인'},
 {name:'헤븐 게이트',day:'DAY 04 · 11/16',desc:'전망 포인트. 구름·비가 심하면 다른 일정으로 전환.',status:'날씨 확인'},
 {name:'루프탑 카페',day:'DAY 04 · 11/16',desc:'외곽 관광 후 늦은 오후에 쉬어가는 시간.',status:'후보 탐색'}
 ].map(p=>'<article class="placecard"><span class="status">'+esc(p.status)+'</span><h3>'+esc(p.name)+'</h3><p>'+esc(p.desc)+'</p><div class="kicker" style="margin-top:12px">'+esc(p.day)+'</div></article>').join('')}</div><div class="callout">현재는 일정에 들어간 명소 후보를 정리한 상태야. 입장료·운영시간·이동시간은 예약 전 공식 정보로 확인해 추가할 예정이야.</div></section>
 </main>
 <footer class="foot">개인 여행 플래너 · 실제 예약·운행 정보는 공식 사이트에서 재확인 · 수정사항은 GitHub에 반영 후 자동 배포</footer>`;
 const tabs=[...document.querySelectorAll('[data-view]')];
 function goView(name){tabs.forEach(b=>b.classList.toggle('active',b.dataset.view===name));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+name));window.scrollTo({top:0,behavior:'smooth'})}
 tabs.forEach(b=>b.addEventListener('click',()=>goView(b.dataset.view)));
 document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>goView(b.dataset.goto)));
 function showDay(n){const day=d.itinerary.find(x=>x.day===Number(n));if(!day)return;document.querySelectorAll('[data-day]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.day)===day.day));const items=day.items.map((it,i)=>{let target='';const txt=(it[1]+' '+it[2]).toLowerCase();if(/철갑상어|저녁|음식|샤브|삼겹살|야시장/.test(txt))target='food';else if(/판시판|깟깟|폭포|헤븐|카페|관광|산악열차/.test(txt))target='sights';else if(/이동|버스|열차|공항|출발|도착|하노이/.test(txt))target='transport';else if(/숙소|체크인|짐 보관/.test(txt))target='lodging';return '<div class="timeitem"><div class="time">'+esc(it[0])+'</div><div><h4>'+esc(it[1])+'</h4><p>'+esc(it[2])+'</p>'+(target?'<div class="event-actions"><button class="mini" data-item-goto="'+target+'">'+({food:'음식 상세 보기',sights:'볼 것 상세 보기',transport:'이동 상세 보기',lodging:'숙박 상세 보기'}[target])+' →</button></div>':'')+'</div></div>'}).join('');document.getElementById('daydetail').innerHTML='<article class="card"><div class="detailhead"><div><span class="chip">DAY '+String(day.day).padStart(2,'0')+' · '+esc(day.date)+'</span><h3>'+esc(day.place)+' — '+esc(day.theme)+'</h3><p>'+esc(day.summary)+'</p></div><span class="chip">DAY PLAN</span></div><div class="timeline">'+items+'</div><div class="decision"><strong>오늘의 결정 포인트</strong>'+esc(day.decision)+'</div></article>';document.querySelectorAll('[data-item-goto]').forEach(b=>b.addEventListener('click',()=>goView(b.dataset.itemGoto)));document.getElementById('daydetail').scrollIntoView({behavior:'smooth',block:'nearest'})}
 document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>showDay(b.dataset.day)));
 if(d.itinerary&&d.itinerary.length)showDay(1);
}
init().catch(err=>{document.getElementById('app').innerHTML='<article class="card"><h2>여행 데이터를 불러오지 못했어.</h2><p>trip-data.json 파일이 웹사이트와 같은 경로에 있는지 확인해 줘.</p></article>';console.error(err)});
</script>
</body>
</html>
