</small></div><div class="tc-op-facts"><span>🕙 SP7 22:40</span><span>4인실 1자리 <b>약 5.2만원 ($39)</b></span><span>2인실 칸 약 21.5만원 ($160)</span></div><ul><li class="p">사설 칸 중 가장 저렴</li><li class="c">편의 시설 정보 적음</li></ul></div><div class="tc-op"><div class="tc-op-head"><b>국철 일반 침대칸</b><small>Vietnam Railways</small></div><div class="tc-op-facts"><span>🕙 SP3 · SP7</span><span>4인실 1자리 <b>약 2.4만원 (467,000 VND)~</b></span></div><ul><li class="p">제일 쌈</li><li class="c">칸을 통째로 못 잡으면 모르는 사람과 합석 · 어메니티 없음</li></ul></div></div><div class="tc-pick"><b>우리한테는</b><p>셋이니까 <b>4인실 칸 통째</b>가 기본. 하노이 숙소 체크아웃 후 샤워가 걸리면 <b>차파(라운지 샤워)</b>, 감성·가격이면 <b>빅사파</b>. 차파 얼리버드 5%는 출발 30일 전까지라 <b>10/15까지</b> 예약해야 돼.</p></div><p class="tc-src">가격은 2026년 8–10월 예약 사이트·후기 기준 · 원화는 $1≈1,345원으로 환산. 표시된 1자리 가격은 “부터” 가격이야. 출처: <a href="https://north-vietnam.com/hanoi-to-sapa-lao-cai-train-schedule-timetable/" target="_blank" rel="noopener">North Vietnam 시간표</a> · <a href="https://sapanomad.com/transport/train-hanoi-to-sapa/" target="_blank" rel="noopener">Sapa Nomad 비교</a> · <a href="https://localvietnam.com/transportation/train/chapa-express/" target="_blank" rel="noopener">Chapa 라운지</a> · <a href="https://www.trvlogue.com/ko/hanoi-sapa-sleeping-train" target="_blank" rel="noopener">빅사파 후기</a> · <a href="https://www.trvlogue.com/en/hanoi-sapa-chapa-express-review" target="_blank" rel="noopener">차파 후기</a></p></section>

<article class="transport-card featured"><div class="transport-card-top"><span class="transport-badge">1순위 · 기본 흐름</span><span>옵션 A</span></div><h3>12:00 버스 · 하노이 시내 경유</h3><div class="transport-metrics"><div><small>시간대 참고</small><b>오전–14시대 출발</b></div><div><small>가격 참고</small><b>약 2.1만–2.6만원 (400,000–500,000 VND)</b></div></div><p>약 5.5–7시간. 숙소나 시내 사무실에서 탑승할 수 있는 편을 고르면 역 환승이 없어 편리해. 하노이 시내에서 저녁을 먹고 싶다면 12:00 전후 출발 → 18시쯤 도착 → 식사 후 그랩으로 공항(약 40분). 체크아웃 시간(보통 12:00)에 맞춰 바로 출발하면 돼.</p><div class="transport-verdict good">가장 단순한 동선 · 당일 버스 시간과 하노이 도착지를 확인</div></article><article class="transport-card"><div class="transport-card-top"><span class="transport-badge">대안 · 숙소 더 즐기기</span><span>옵션 B</span></div><h3>🚌 사파 → 노이바이공항 직행 버스</h3><div class="transport-metrics"><div><small>추천 출발</small><b>14:00 → 20:30 공항</b></div><div><small>가격 참고</small><b>1인 약 1.6만원 ($12 · 사오비엣 싱글캐빈)</b></div></div><p>12:00 체크아웃 후 숙소에서 점심까지 먹고 출발해도 VJ960(01:45) 체크인까지 5시간 여유. 사파 → 공항 직행편이 11:30부터 30분–1시간 간격으로 있어서, 숙소를 더 즐기고 싶으면 15:00(21:30 도착)도 가능. 하노이 시내를 거치지 않아 짐 들고 이동할 일이 없어.</p><div class="transport-verdict good">숙소 시간 최대 확보 · 하노이 시내 일정은 빠짐 · 숙소 픽업 가능 여부 확인</div><p><a href="https://12go.com/en/travel/sapa/hanoi-airport" target="_blank" rel="noopener">사파 → 노이바이공항 시간표·예약 ↗</a></p></article>
<article class="transport-card"><div class="transport-card-top"><span class="transport-badge">주간 열차</span><span>옵션 C</span></div><h3>사파 → 라오까이역 → 낮 기차</h3><div class="transport-metrics"><div><small>열차 시간 참고</small><b>12:05 → 19:37</b></div><div><small>요금 참고</small><b>좌석 약 1만원 (200,000 VND)부터</b></div></div><p>사파에서 라오까이역까지 약 1시간 차량 이동 후 SP8 등 낮 열차를 이용하는 방식이야. 기차만 약 7시간 30분이라 역 이동과 대기까지 합치면 시간이 길어져. 귀국편 당일 연결은 열차 지연 위험 때문에 추천하지 않아.</p><div class="transport-verdict">열차 경험이 중요하다면 시간 여유를 두고 비교</div></article>
<article class="transport-card risk-card"><div class="transport-card-top"><span class="transport-badge">이번 일정엔 비추천</span><span>옵션 D</span></div><h3>야간열차 · 라오까이 21:00대 출발</h3><div class="transport-metrics"><div><small>시간표 예시</small><b>21:00 → 다음 날 05:15</b></div><div><small>요금 참고</small><b>침대 약 1.6만원 (300,000 VND)부터</b></div></div><p>일반적으로 야간열차가 있지만, 11/17 밤에 타면 하노이에 11/18 새벽 도착할 수 있어. 귀국 항공편은 이미 01:45에 출발하므로 이번 귀국 일정에는 사용할 수 없어.</p><div class="transport-verdict risk">11/17 사파 출발은 낮 버스 또는 낮 열차로 계획</div></article>

<article class="transport-card"><div class="transport-card-top"><span class="transport-badge">저렴하지만 제한</span><span>시내 일반버스</span></div><h3>7번·17번·90번 등</h3><div class="transport-metrics"><div><small>소요 시간</small><b>약 60–90분 이상</b></div><div><small>1인 요금</small><b>약 600–800원 (12,000–15,000 VND)</b></div></div><p>가장 저렴하지만 정류장과 숙소 사이 이동, 짐, 운행 종료 시간을 고려해야 해. 01:45 출발 국제선 공항 이동 수단으로는 적합하지 않아.</p></article>

 // Live VND -> KRW reference rate. Refresh every 30 minutes while the page stays open.
 const vndInput=document.getElementById('vnd-amount');
 const krwResult=document.getElementById('krw-result');
 const fxStatus=document.getElementById('fx-status');
 const fxRateNote=document.getElementById('fx-rate-note');
 let vndToKrw=0.052;
 let fxIsLive=false;
 const fmtKRW=n=>Math.round(n).toLocaleString('ko-KR')+'원';
 const fmtVND=n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:4}).format(n);
 function parseVnd(value){return Number(String(value).replace(/[^0-9]/g,''))||0}
 function renderFx(){const amount=Math.max(0,parseVnd(vndInput.value));krwResult.textContent=fmtKRW(amount*vndToKrw);fxRateNote.textContent=(fxIsLive?'기준 환율: 1 VND ≈ '+vndToKrw.toFixed(5)+' KRW':'임시 참고 환율: 1 VND ≈ 0.052원')+' · 실제 환전·카드 수수료에 따라 달라질 수 있어.'}
 async function refreshFx(){try{fxStatus.textContent='환율 업데이트 중';const res=await fetch('https://open.er-api.com/v6/latest/VND',{cache:'no-store'});if(!res.ok)throw new Error('FX request failed');const data=await res.json();const rate=Number(data?.rates?.KRW);if(!Number.isFinite(rate)||rate<=0)throw new Error('Invalid KRW rate');vndToKrw=rate;fxIsLive=true;fxStatus.textContent='기준 환율 · '+(data.time_last_update_utc?new Date(data.time_last_update_utc).toLocaleDateString('ko-KR'):'업데이트됨');renderFx()}catch(e){fxStatus.textContent='실시간 환율 연결 실패';renderFx()}}
 vndInput.addEventListener('input',()=>{const digits=String(vndInput.value).replace(/[^0-9]/g,'');const formatted=digits?Number(digits).toLocaleString('en-US'):'';vndInput.value=formatted;renderFx()});renderFx();refreshFx();setInterval(refreshFx,30*60*1000);
