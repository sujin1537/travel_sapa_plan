<!doctype html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Hanoi & Sapa · Tripbook</title>
<style>
:root{--bg:#f5f4ef;--paper:#fff;--ink:#202923;--muted:#788078;--line:#e7e8e1;--green:#315b49;--green2:#eaf1eb;--lime:#d6e6a4;--sand:#f4e8d9;--orange:#b56d3e;--blue:#e8eff4;--shadow:0 8px 28px rgba(29,46,35,.055)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;line-height:1.55}button,a{font:inherit}a{color:var(--green);text-decoration:none}a:hover{text-decoration:underline}button{cursor:pointer}.shell{max-width:1120px;margin:auto;padding:22px 22px 70px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-size:12px;font-weight:850;letter-spacing:.16em;color:var(--green)}.updated{font-size:12px;color:var(--muted)}.hero{background:var(--green);color:white;border-radius:26px;padding:30px 32px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-60px;top:-120px;width:300px;height:300px;border:1px solid #ffffff20;border-radius:50%;box-shadow:0 0 0 36px #ffffff08,0 0 0 72px #ffffff05;pointer-events:none}.hero-grid{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;position:relative;z-index:1}.eyebrow{font-size:11px;letter-spacing:.17em;color:#cdded1;font-weight:800}.hero h1{font-size:clamp(31px,5vw,48px);letter-spacing:-.045em;line-height:1.08;margin:12px 0}.hero p{margin:0;color:#dce8df;font-size:14px}.hero-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.stat{background:#ffffff15;border:1px solid #ffffff19;padding:8px 11px;border-radius:12px;font-size:12px;color:#f1f6f2}.hero-side{font-size:12px;color:#dce8df;max-width:170px;text-align:right}.hero-side strong{display:block;font-size:17px;color:white;margin-bottom:4px}.mainnav{display:flex;gap:6px;margin:20px 0 22px;padding:5px;background:#e9e9e1;border-radius:15px;position:sticky;top:8px;z-index:10;box-shadow:0 5px 16px #20352b0a}.navbtn{border:0;background:transparent;color:#667067;padding:12px 15px;border-radius:11px;font-size:14px;font-weight:750;flex:1}.navbtn.active{background:white;color:var(--green);box-shadow:0 2px 7px #1d342510}.view{display:none}.view.active{display:block}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:26px 0 14px}.sectionhead h2{margin:0;font-size:22px;letter-spacing:-.03em}.sectionhead p{margin:4px 0 0;color:var(--muted);font-size:13px}.chip{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:var(--green2);color:var(--green);font-size:11px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:19px;min-width:0;box-shadow:var(--shadow)}.flightgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.flight{display:flex;gap:13px;align-items:flex-start}.flight-icon{width:42px;height:42px;display:grid;place-items:center;background:var(--green2);border-radius:13px;color:var(--green);font-size:20px;flex-shrink:0}.kicker{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}.flight h3{margin:4px 0;font-size:16px}.flight p{margin:0;font-size:13px;color:var(--muted)}.daylist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.daycard{border:1px solid var(--line);background:white;border-radius:17px;padding:0;text-align:left;color:inherit;overflow:hidden;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}.daycard:hover{transform:translateY(-2px);border-color:#b6c9ba}.daycard.selected{border:2px solid var(--green)}.daytop{padding:15px 16px 13px;background:#fdfdfb;border-bottom:1px solid var(--line)}.dayno{display:flex;align-items:center;justify-content:space-between;color:var(--green);font-size:11px;font-weight:850;letter-spacing:.1em}.dayno span{background:var(--green2);padding:4px 7px;border-radius:7px}.daytop h3{margin:9px 0 3px;font-size:17px;letter-spacing:-.025em}.daytop p{margin:0;color:var(--muted);font-size:12px}.daybody{padding:13px 16px 16px}.daybody ul{list-style:none;margin:0;padding:0}.daybody li{display:flex;gap:9px;padding:5px 0;font-size:12px;color:#4f5a51}.daybody li:before{content:"";width:5px;height:5px;border-radius:50%;background:#b7c7b8;margin-top:7px;flex-shrink:0}.dayfoot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;font-weight:800;color:var(--green)}.daydetail{margin-top:14px}.detailhead{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.detailhead h3{font-size:21px;letter-spacing:-.03em;margin:6px 0}.detailhead p{margin:0;color:var(--muted);font-size:13px}.timeline{margin-top:15px}.timeitem{display:grid;grid-template-columns:68px 1fr;gap:13px;padding:13px 0;border-top:1px solid var(--line)}.time{font-size:12px;font-weight:850;color:var(--green);padding-top:2px}.timeitem h4{margin:0;font-size:14px}.timeitem p{margin:4px 0 0;color:var(--muted);font-size:12px}.event-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.mini{border:1px solid var(--line);background:white;color:var(--green);border-radius:9px;padding:6px 9px;font-size:11px;font-weight:800}.decision{margin-top:14px;background:#f7f1e8;border:1px solid #eee0cf;border-radius:13px;padding:13px 14px;font-size:12px;color:#735638}.decision strong{display:block;margin-bottom:3px;color:#8c572d}.detailnav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.detailtab{border:1px solid var(--line);background:#fff;color:#667067;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800}.detailtab.active{background:var(--green);border-color:var(--green);color:white}.intro{font-size:14px;color:#5e685f;margin:0 0 16px;max-width:800px}.optiongrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.option{background:white;border:1px solid var(--line);border-radius:17px;padding:17px;min-width:0}.option.featured{border:2px solid var(--green);background:#fcfefb}.option h3{font-size:16px;line-height:1.3;margin:9px 0 6px}.option .muted{font-size:12px;color:var(--muted)}.option h4{font-size:11px;color:var(--green);margin:14px 0 5px;text-transform:uppercase;letter-spacing:.06em}.option ul{padding-left:17px;margin:0;font-size:12px;color:#4f5a51}.option li{margin:5px 0}.option .decision{font-size:11px}.split{display:grid;grid-template-columns:1fr 1fr;gap:13px}.subhead{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--green);font-weight:850;margin:0 0 12px}.hotelgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.hotel{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}.hotel h4{font-size:14px;margin:0 0 5px}.hotel p{font-size:12px;color:var(--muted);margin:0}.hotel a{display:inline-block;font-size:12px;font-weight:800;margin-top:9px}.checklist{list-style:none;margin:0;padding:0}.checklist li{position:relative;padding:9px 0 9px 24px;border-bottom:1px solid var(--line);font-size:13px;color:#505b52}.checklist li:last-child{border:0}.checklist li:before{content:"✓";position:absolute;left:0;top:8px;width:16px;height:16px;border-radius:5px;background:var(--green2);color:var(--green);font-size:11px;font-weight:900;text-align:center;line-height:16px}.foodcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.foodcard{background:white;border:1px solid var(--line);border-radius:16px;padding:17px}.foodicon{font-size:22px}.foodcard h3{font-size:16px;margin:10px 0 5px}.foodcard p{font-size:12px;color:var(--muted);margin:0}.foodcard .where{display:inline-block;margin-top:12px;color:var(--orange);font-size:11px;font-weight:850}.placegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.placecard{background:white;border:1px solid var(--line);border-radius:16px;padding:17px}.placecard h3{font-size:16px;margin:8px 0 5px}.placecard p{font-size:12px;color:var(--muted);margin:0}.status{display:inline-block;font-size:10px;font-weight:850;color:#7b684a;background:#f5eddf;border-radius:6px;padding:4px 7px}.callout{background:var(--blue);border-radius:14px;padding:14px 16px;color:#405763;font-size:12px;margin-top:14px}.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:11px}.hide{display:none!important}
@media(max-width:760px){.shell{padding:14px 12px 44px}.hero{padding:25px 22px;border-radius:21px}.hero-grid{grid-template-columns:1fr}.hero-side{text-align:left;max-width:none}.mainnav{top:4px;overflow-x:auto}.navbtn{white-space:nowrap;padding:11px 8px;font-size:12px}.daylist{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.daytop{padding:12px}.daytop h3{font-size:15px}.daybody{padding:10px 12px}.daybody li{font-size:11px}.optiongrid,.foodcards,.placegrid{grid-template-columns:1fr}.split,.grid,.flightgrid{grid-template-columns:1fr}.hotelgrid{grid-template-columns:1fr}.sectionhead h2{font-size:20px}.card{padding:15px}.detailhead{display:block}.detailhead .chip{margin-top:8px}}
@media(max-width:390px){.daylist{grid-template-columns:1fr}.hero h1{font-size:32px}}
</style>
</head>
<body>
<div class="shell" id="app"><div class="card">여행 플래너를 불러오는 중…</div></div>
<script>
async function init(){
 const res=await fetch('./trip-data.json'); if(!res.ok)throw new Error('trip-data.json load failed');
 const d=await res.json(); const app=document.getElementById('app');
 const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
 const a=(url,label)=>safeUrl(url)?'<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(label||'공식 사이트 열기')+' ↗</a>':'<span class="muted">공식 링크 확인 필요</span>';
 const iconFor=t=>t.includes('철갑')?'♨':t.includes('판시판')?'⛰':t.includes('열차')?'🚆':t.includes('공항')?'✈':t.includes('숙소')?'⌂':t.includes('음식')||t.includes('저녁')?'🍜':t.includes('카페')?'☕':'•';
 app.innerHTML=`
 <div class="topline"><div class="brand">FIELD NOTES / VIETNAM 2026</div><div class="updated">UPDATED · ${esc(d.meta.updatedAt)}</div></div>
 <header class="hero"><div class="hero-grid"><div><div class="eyebrow">HANOI × SAPA · NOV 13—18</div><h1>하노이 & 사파<br>우리의 여행 기록</h1><p>일정은 한눈에, 결정은 명확하게, 세부 정보는 필요한 만큼.</p><div class="hero-stats"><span class="stat">👥 3명</span><span class="stat">📅 6일 일정</span><span class="stat">✈ 7C2201 / VJ960</span></div></div><div class="hero-side"><strong>13 NOV — 18 NOV</strong>서울 → 하노이 → 사파 → 하노이 → 서울</div></div></header>
 <nav class="mainnav" aria-label="주 메뉴"><button class="navbtn active" data-view="overview">여행 전체</button><button class="navbtn" data-view="transport">이동</button><button class="navbtn" data-view="lodging">숙박</button><button class="navbtn" data-view="food">음식</button><button class="navbtn" data-view="sights">볼 것</button></nav>
 <main>
 <section id="view-overview" class="view active">
  <div class="sectionhead"><div><h2>6일 여행 한눈에 보기</h2><p>날짜 카드를 누르면 해당 일자의 세부 일정이 열려. 음식·이동·관광 버튼은 관련 상세 페이지로 연결돼.</p></div><span class="chip">DAY 01—06</span></div>
  <div class="flightgrid">${d.flights.map(f=>'<article class="card flight"><div class="flight-icon">✈</div><div><div class="kicker">'+esc(f.label)+' · '+esc(f.date)+'</div><h3>'+esc(f.route)+'</h3><p>'+esc(f.flight)+' · '+esc(f.time)+'</p></div></article>').join('')}</div>
  <div class="sectionhead"><div><h2>여행 일정</h2><p>각 Day를 눌러 타임라인과 결정할 사항을 확인해.</p></div></div>
  <div class="daylist" id="daylist">${(d.itinerary||[]).map(day=>'<button class="daycard" data-day="'+day.day+'"><div class="daytop"><div class="dayno">DAY '+String(day.day).padStart(2,'0')+' <span>'+esc(day.date)+'</span></div><h3>'+esc(day.place)+'</h3><p>'+esc(day.theme)+'</p></div><div class="daybody"><div class="muted">'+esc(day.summary)+'</div><ul>'+day.items.slice(0,3).map(i=>'<li>'+esc(i[1])+'</li>').join('')+'</ul><div class="dayfoot"><span>일정 상세 보기</span><span>↗</span></div></div></button>').join('')}</div>
  <div id="daydetail" class="daydetail"></div>
  <div class="sectionhead"><div><h2>먼저 결정할 것</h2><p>아직 확정하지 않은 선택지만 따로 모았어.</p></div></div>
  <div class="grid"><article class="card"><span class="chip">DECISION 01</span><h3>하노이 도착 후 사파 이동</h3><p class="intro">01:30 공항 버스 / 04:00 시내 버스 / 하노이 휴식 후 야간열차</p><button class="mini" data-goto="transport">이동 옵션 비교하기 →</button></article><article class="card"><span class="chip">DECISION 02</span><h3>사파 숙소와 숙박 박수</h3><p class="intro">버스안은 사파 3박, 열차안은 사파 2박과 하노이 첫날 휴식을 검토.</p><button class="mini" data-goto="lodging">숙소 후보 보기 →</button></article></div>
 </section>
 <section id="view-transport" class="view"><div class="sectionhead"><div><h2>이동 계획</h2><p>출발 시간보다 중요한 건 실제 픽업 위치와 연결 여유야.</p></div><span class="chip">COMPARE</span></div><p class="intro">${esc(d.detailTabs.transport.intro)}</p><div class="optiongrid">${d.detailTabs.transport.options.map(o=>'<article class="option '+(o.id==='B'?'featured':'')+'"><span class="chip">OPTION '+esc(o.id)+'</span><h3>'+esc(o.name)+'</h3><div class="muted">'+esc(o.tag)+'</div><h4>장점</h4><ul>'+o.pros.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><h4>주의점</h4><ul>'+o.cons.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><div class="decision"><strong>결정 기준</strong>'+esc(o.decision)+'</div></article>').join('')}</div><div class="sectionhead"><div><h2>예약 전 체크</h2><p>운송사에 확인하고 난 뒤 예약 상태를 확정하자.</p></div></div><article class="card"><ul class="checklist">'+d.detailTabs.transport.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul><div class="event-actions"><a class="mini" href="'+esc(d.transport.g8Url)+'" target="_blank" rel="noopener">G8 노선 확인 ↗</a><a class="mini" href="'+esc(d.transport.contactUrl)+'" target="_blank" rel="noopener">G8 문의 ↗</a></div></article></section>
 <section id="view-lodging" class="view"><div class="sectionhead"><div><h2>숙박 후보</h2><p>3인실 · 청결 · 위치 · 합리적인 가격을 기준으로 비교</p></div><span class="chip">NOT BOOKED</span></div><p class="intro">${esc(d.detailTabs.lodging.intro)}</p><div class="split"><article class="card"><h3 class="subhead">하노이</h3><div class="hotelgrid">${d.detailTabs.lodging.hanoi.map(h=>'<div class="hotel"><h4>'+esc(h.name)+'</h4><p>'+esc(h.note)+'</p>'+a(h.url,'공식 사이트')+'</div>').join('')}</div></article><article class="card"><h3 class="subhead">사파</h3><div class="hotelgrid">${d.detailTabs.lodging.sapa.map(h=>'<div class="hotel"><h4>'+esc(h.name)+'</h4><p>'+esc(h.note)+'</p>'+a(h.url,'공식 사이트')+'</div>').join('')}</div></article></div><div class="sectionhead"><div><h2>예약 결정 체크리스트</h2><p>여정 선택에 따라 숙박일이 달라져.</p></div></div><article class="card"><ul class="checklist">${d.detailTabs.lodging.decisions.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></article></section>
 <section id="view-food" class="view"><div class="sectionhead"><div><h2>음식 노트</h2><p>하노이는 음식 탐방 시간을 넉넉히, 사파는 철갑상어 샤브샤브를 우선.</p></div><span class="chip">FOOD FIRST</span></div><p class="intro">${esc(d.detailTabs.food.intro)}</p><div class="foodcards">${d.detailTabs.food.priorities.map((f,i)=>'<article class="foodcard"><div class="foodicon">'+['🍜','♨','🥓'][i%3]+'</div><h3>'+esc(f.title)+'</h3><p>'+esc(f.detail)+'</p><span class="where">'+esc(f.where)+'</span></article>').join('')}</div><div class="callout">${esc(d.detailTabs.food.note)}</div></section>
 <section id="view-sights" class="view"><div class="sectionhead"><div><h2>볼 것 · 할 것</h2><p>날씨와 체력에 따라 순서를 바꿀 수 있도록 명소별로 분리했어.</p></div><span class="chip">FLEXIBLE</span></div><div class="placegrid">${[
 {name:'판시판',day:'DAY 03 · 11/15',desc:'케이블카와 산 정상 전망. 날씨가 좋을 때 우선 배치.',status:'날씨 확인'},
 {name:'무엉화 산악열차',day:'DAY 03 · 11/15',desc:'판시판 이동 동선과 운영시간을 함께 확인.',status:'운영 확인'},
 {name:'깟깟마을',day:'DAY 03 · 11/15',desc:'오르내리는 구간이 있어 체력과 날씨 고려.',status:'동선 조정'},
 {name:'사랑폭포',day:'DAY 04 · 11/16',desc:'시내 밖 이동이 필요할 수 있어 교통편을 먼저 정하기.',status:'교통 확인'},
 {name:'헤븐 게이트',day:'DAY 04 · 11/16',desc:'전망 포인트. 구름·비가 심하면 다른 일정으로 전환.',status:'날씨 확인'},
 {name:'루프탑 카페',day:'DAY 04 · 11/16',desc:'외곽 관광 후 늦은 오후에 쉬어가는 시간.',status:'후보 탐색'}
 ].map(p=>'<article class="placecard"><span class="status">'+esc(p.status)+'</span><h3>'+esc(p.name)+'</h3><p>'+esc(p.desc)+'</p><div class="kicker" style="margin-top:12px">'+esc(p.day)+'</div></article>').join('')}</div><div class="callout">현재는 일정에 들어간 명소 후보를 정리한 상태야. 입장료·운영시간·이동시간은 예약 전 공식 정보로 확인해 추가할 예정이야.</div></section>
 </main>
 <footer class="foot">개인 여행 플래너 · 실제 예약·운행 정보는 공식 사이트에서 재확인 · 수정사항은 GitHub에 반영 후 자동 배포</footer>`;
 const tabs=[...document.querySelectorAll('[data-view]')];
 function goView(name){tabs.forEach(b=>b.classList.toggle('active',b.dataset.view===name));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+name));window.scrollTo({top:0,behavior:'smooth'})}
 tabs.forEach(b=>b.addEventListener('click',()=>goView(b.dataset.view)));
 document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>goView(b.dataset.goto)));
 function showDay(n){const day=d.itinerary.find(x=>x.day===Number(n));if(!day)return;document.querySelectorAll('[data-day]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.day)===day.day));const items=day.items.map((it,i)=>{let target='';const txt=(it[1]+' '+it[2]).toLowerCase();if(/철갑상어|저녁|음식|샤브|삼겹살|야시장/.test(txt))target='food';else if(/판시판|깟깟|폭포|헤븐|카페|관광|산악열차/.test(txt))target='sights';else if(/이동|버스|열차|공항|출발|도착|하노이/.test(txt))target='transport';else if(/숙소|체크인|짐 보관/.test(txt))target='lodging';return '<div class="timeitem"><div class="time">'+esc(it[0])+'</div><div><h4>'+esc(it[1])+'</h4><p>'+esc(it[2])+'</p>'+(target?'<div class="event-actions"><button class="mini" data-item-goto="'+target+'">'+({food:'음식 상세 보기',sights:'볼 것 상세 보기',transport:'이동 상세 보기',lodging:'숙박 상세 보기'}[target])+' →</button></div>':'')+'</div></div>'}).join('');document.getElementById('daydetail').innerHTML='<article class="card"><div class="detailhead"><div><span class="chip">DAY '+String(day.day).padStart(2,'0')+' · '+esc(day.date)+'</span><h3>'+esc(day.place)+' — '+esc(day.theme)+'</h3><p>'+esc(day.summary)+'</p></div><span class="chip">DAY PLAN</span></div><div class="timeline">'+items+'</div><div class="decision"><strong>오늘의 결정 포인트</strong>'+esc(day.decision)+'</div></article>';document.querySelectorAll('[data-item-goto]').forEach(b=>b.addEventListener('click',()=>goView(b.dataset.itemGoto)));document.getElementById('daydetail').scrollIntoView({behavior:'smooth',block:'nearest'})}
 document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>showDay(b.dataset.day)));
 if(d.itinerary&&d.itinerary.length)showDay(1);
}
init().catch(err=>{document.getElementById('app').innerHTML='<article class="card"><h2>여행 데이터를 불러오지 못했어.</h2><p>trip-data.json 파일이 웹사이트와 같은 경로에 있는지 확인해 줘.</p></article>';console.error(err)});
