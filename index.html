<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f6f2">
<title>하노이 · 사파 여행 플래너</title>
<style>
:root{--ink:#202b27;--muted:#69736d;--paper:#f7f6f2;--card:#fff;--line:#e4e7df;--green:#285b49;--mint:#e6f0e9;--orange:#c77742;--shadow:0 10px 30px #20352b0b}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;line-height:1.55}a{color:var(--green);text-decoration:none}a:hover{text-decoration:underline}.wrap{max-width:1040px;margin:auto;padding:28px 20px 64px}.hero{background:#234f40;color:white;border-radius:26px;padding:34px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:250px;height:250px;border:1px solid #ffffff20;border-radius:50%;right:-70px;top:-90px;box-shadow:0 0 0 35px #ffffff08,0 0 0 70px #ffffff06}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#c5ddce;font-weight:700}.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.12;margin:12px 0}.hero p{margin:0;color:#e1eee5}.hero-meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.pill{display:inline-flex;align-items:center;padding:7px 11px;border-radius:99px;background:#ffffff17;color:inherit;font-size:13px}.section{margin-top:30px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}.section h2{font-size:21px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}.flight{display:flex;gap:14px;align-items:start}.flight-icon{background:var(--mint);color:var(--green);width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex-shrink:0}.muted{color:var(--muted);font-size:13px}.flight h3,.hotel h3{margin:2px 0 5px;font-size:17px}.flight .time{font-weight:650;margin-top:7px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);border-radius:99px;background:white;color:var(--ink);padding:10px 14px;cursor:pointer;font:inherit;font-size:14px}.tab.active{background:var(--green);border-color:var(--green);color:white}.scenario-top{display:flex;align-items:start;justify-content:space-between;gap:12px}.scenario-top h3{margin:0;font-size:20px}.tag{white-space:nowrap;background:var(--mint);color:var(--green);padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700}.timeline{margin-top:18px}.event{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:13px 0;border-top:1px solid var(--line)}.date{font-size:13px;font-weight:750;color:var(--green)}.event strong{display:block;font-size:14px}.event p{margin:3px 0 0;font-size:13px;color:var(--muted)}.warning{background:#fff5e9;border:1px solid #f2dfc7;color:#704a2f;padding:13px 14px;border-radius:13px;font-size:13px;margin-top:14px}.list{padding-left:19px;margin:10px 0 0}.list li{margin:7px 0}.hotel{display:flex;flex-direction:column;gap:7px}.hotel h3{font-size:16px}.hotel .hotel-link{margin-top:auto;padding-top:6px;font-size:13px;font-weight:650}.small-title{font-size:14px;color:var(--green);font-weight:800;margin:0 0 12px}.contact{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.link{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;background:white}.foot{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}.loading{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:680px){.wrap{padding:16px 13px 42px}.hero{padding:25px 22px;border-radius:20px}.grid{grid-template-columns:1fr}.card{padding:17px}.event{grid-template-columns:78px 1fr}.section-head{align-items:start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">여행 계획을 불러오는 중…</div></div>
<script>
async function start(){
 const response=await fetch('./trip-data.json');
 if(!response.ok) throw new Error('trip-data.json을 불러오지 못했습니다.');
 const d=await response.json(); const app=document.getElementById('app');
 const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const link=(url,label)=>url?'<a href="'+safe(url)+'" target="_blank" rel="noopener">'+safe(label||'공식 사이트 열기')+' ↗</a>':'공식 사이트 확인 필요';
 app.innerHTML=`
 <header class="hero"><div class="eyebrow">TRAVEL PLANNER · NOV 2026</div><h1>${safe(d.meta.title)}</h1><p>${safe(d.meta.subtitle)} · 하노이 & 사파</p><div class="hero-meta"><span class="pill">3명 여행</span><span class="pill">교통 · 숙소 중심</span><span class="pill">계획 업데이트 ${safe(d.meta.updatedAt)}</span></div></header>
 <section class="section"><div class="section-head"><div><h2>✈ 항공 일정</h2><div class="sub">현재 계획 기준 · 예약 내역과 대조 필요</div></div></div><div class="grid">${d.flights.map(f=>`<article class="card flight"><div class="flight-icon">✈</div><div><div class="muted">${safe(f.label)} · ${safe(f.date)}</div><h3>${safe(f.route)}</h3><div class="muted">${safe(f.flight)}</div><div class="time">${safe(f.time)}</div></div></article>`).join('')}</div></section>
 <section class="section"><div class="section-head"><div><h2>🚌 이동 시나리오</h2><div class="sub">탭을 눌러 일정과 주의사항 비교</div></div></div><div class="tabs" role="tablist">${d.scenarios.map((s,i)=>`<button class="tab ${i===1?'active':''}" data-scenario="${safe(s.id)}" role="tab">${safe(s.id)} · ${safe(s.name)}</button>`).join('')}</div><div id="scenario"></div></section>
 <section class="section"><div class="section-head"><div><h2>🏨 숙소 후보</h2><div class="sub">3인실 · 청결 · 위치를 우선으로 검토</div></div></div><div class="card"><p class="small-title">하노이</p><div class="grid">${d.hotels.hanoi.map(h=>`<article class="hotel"><h3>${safe(h.name)}</h3><div class="muted">${safe(h.note)}</div><div class="hotel-link">${link(h.url,'숙소 사이트')}</div></article>`).join('')}</div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><p class="small-title">사파</p><div class="grid">${d.hotels.sapa.map(h=>`<article class="hotel"><h3>${safe(h.name)}</h3><div class="muted">${safe(h.note)}</div><div class="hotel-link">${link(h.url,'숙소 사이트')}</div></article>`).join('')}</div><div class="warning">${safe(d.hotels.note)}</div></div></section>
 <section class="section"><div class="section-head"><div><h2>📍 예약 전 체크</h2><div class="sub">놓치기 쉬운 확인 사항</div></div></div><div class="grid"><article class="card"><p class="small-title">G8 Open Tour</p><div class="muted">연락처: ${safe(d.transport.phone)}<br>이메일: ${safe(d.transport.email)}<br>문의 시간: ${safe(d.transport.contactHours)}</div><ul class="list">${d.transport.reasons.map(x=>'<li>'+safe(x)+'</li>').join('')}</ul><div class="warning">${safe(d.transport.pickupNote)}</div><div class="contact"><a class="link" href="${safe(d.transport.g8Url)}" target="_blank" rel="noopener">노선·예약 확인 ↗</a><a class="link" href="${safe(d.transport.contactUrl)}" target="_blank" rel="noopener">운송사 문의 ↗</a></div></article><article class="card"><p class="small-title">기억할 것</p><ul class="list">${d.reminders.map(x=>'<li>'+safe(x)+'</li>').join('')}</ul></article></div></section>
 <footer class="foot">${safe(d.meta.note)}<br>이 페이지는 개인 여행 계획표이며 예약·운행 확정 정보가 아닙니다.</footer>`;
 function show(id){const s=d.scenarios.find(x=>x.id===id)||d.scenarios[1];document.querySelectorAll('[data-scenario]').forEach(b=>b.classList.toggle('active',b.dataset.scenario===id));document.getElementById('scenario').innerHTML='<article class="card"><div class="scenario-top"><div><h3>'+safe(s.name)+'</h3><div class="sub">'+safe(s.summary)+'</div></div><span class="tag">'+safe(s.tag)+'</span></div><div class="timeline">'+s.schedule.map(e=>'<div class="event"><div class="date">'+safe(e[0])+'</div><div><strong>'+safe(e[1])+'</strong><p>'+safe(e[2])+'</p></div></div>').join('')+'</div><div class="warning">'+safe(s.caution)+'</div></article>'}
 document.querySelectorAll('[data-scenario]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.scenario)));show('B');
}
start().catch(e=>{document.getElementById('app').innerHTML='<div class="card">페이지 데이터를 불러오지 못했습니다. trip-data.json과 index.html이 같은 폴더에 있는지 확인하세요.</div>';console.error(e)});
</script>
</body>
</html>
